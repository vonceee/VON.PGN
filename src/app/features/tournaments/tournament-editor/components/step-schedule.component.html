<div class="space-y-6">
  @if (scheduleDaysArray.length === 0) {
  <p class=" text-sm/6 py-8 text-center bg-slate-200  rounded-xl border-2  border-slate-200">No schedule days added
    yet.
  </p>
  }

  <div class="space-y-6">
    @for (day of scheduleDaysArray.controls; track $index; let di = $index) {
    <div class="p-6 bg-white  rounded-xl border border-slate-200">
      <div class="flex justify-between items-center mb-6">
        <span class="bg-blue-600  text-blue-600/70  px-3 py-1 rounded-full text-xs font-semibold ">Day {{ di + 1 }}
          Schedule</span>
        <div class="flex gap-2">
          <button type="button" (click)="addScheduleEvent.emit(di)"
            class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-white border border-slate-200 font-medium text-[16px] leading-5 hover:bg-slate-200 transition-all cursor-pointer">
            + Add Event
          </button>
          <button type="button" (click)="removeScheduleDay.emit(di)"
            class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-red-50 border border-transparent text-red-700 hover:bg-red-100 hover:text-red-800 transition-colors font-medium text-[16px] leading-5 cursor-pointer">
            Remove Day
          </button>
        </div>
      </div>
      <div class="space-y-3">
        @for (event of getScheduleEvents(di).controls; track $index; let ei = $index) {
        <div class="flex gap-3 items-center group">
          <input type="text" [formControl]="getControl(scheduleEventGroup(di, ei), 'name')"
            placeholder="e.g. Onsite Registration"
            class="flex-1 pl-3 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm/6 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600/50" />
          <input type="text" [formControl]="getControl(scheduleEventGroup(di, ei), 'time')"
            placeholder="Time (e.g. 9:00 AM - 11:00 AM)"
            class="w-48 pl-3 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm/6 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600/50" />
          <button type="button" (click)="removeScheduleEvent.emit({di, ei})"
            class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-red-50 border border-transparent text-red-700 hover:bg-red-100 hover:text-red-800 transition-colors font-medium text-[16px] leading-5 cursor-pointer opacity-50 group-hover:opacity-100">
            ✕
          </button>
        </div>
        }
      </div>
    </div>
    }
    <button type="button" (click)="addScheduleDay.emit()"
      class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-white border border-slate-200 font-medium text-[16px] leading-5 hover:bg-slate-200 transition-all cursor-pointer w-full">
      + Add New Day
    </button>
  </div>
</div>
