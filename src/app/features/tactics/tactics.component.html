<div class="h-auto min-h-full lg:h-full w-full p-4 lg:p-8 flex flex-col relative overflow-y-auto lg:overflow-hidden">
  <div class="w-full flex-1 flex flex-col lg:flex-row gap-8 items-stretch relative min-h-0">

    @if (!currentPuzzle() && isLoading()) {
      <app-tactics-skeleton />
    } @else if (!currentPuzzle() && hasError()) {
      <div class="flex-1 flex flex-col items-center justify-center gap-4 text-center p-6">
        <div class="w-12 h-12 rounded-full bg-rose-50 border border-rose-200 flex items-center justify-center text-rose-600">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-medium text-slate-800 mb-1">Failed to load puzzle</h2>
          <p class="text-muted text-sm max-w-sm">We could not load a tactics puzzle at this time. Please check your connection and try again.</p>
        </div>
        <button type="button" (click)="loadNextPuzzle()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl cursor-pointer transition-colors">
          Retry
        </button>
      </div>
    } @else {
    <div class="flex-1 w-full lg:overflow-hidden flex flex-col min-h-0">
      @if (transitionError()) {
      <div class="w-full max-w-[1080px] mx-auto mb-3 px-4 py-2.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <span>{{ transitionError() }}</span>
        </div>
        <button type="button" (click)="transitionError.set(null)" class="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2 py-0.5 rounded cursor-pointer">
          Dismiss
        </button>
      </div>
      }

      <div
        class="grid w-full max-w-[1080px] mx-auto grid-cols-1 lg:grid-cols-[1fr_400px] gap-3 lg:gap-6 xl:gap-8 h-auto lg:h-full lg:overflow-hidden">

        <!-- Board Column -->
        <div class="flex-1 flex items-center justify-center min-h-0 min-w-0">
          <div
            class="board-container-parent w-full aspect-square lg:aspect-auto h-auto lg:h-full max-w-[620px] max-h-[620px] flex items-center justify-center">
            <app-tactics-board [puzzle]="currentPuzzle()" [exploreMode]="exploreMode()" [retryMode]="retryMode()"
              (puzzleSolved)="onPuzzleSolved()" (puzzleFailed)="onPuzzleFailed()" (wrongMove)="onWrongMove()"
              (moveMade)="onPuzzleMoveMade($event)" (userColorChange)="onUserColorChange($event)"
              class="block w-full h-full"></app-tactics-board>
          </div>
        </div>

        <!-- Stats Sidebar Column -->
        <div class="w-full lg:w-[400px] flex flex-col justify-center min-h-0">
          <div
            class="w-full h-auto lg:h-[400px] max-h-[620px] mt-4 lg:mt-0 flex flex-col min-h-0 overflow-hidden border-2 border-slate-200 rounded-4xl bg-white gap-2">
            <div class="flex flex-col overflow-hidden w-full h-full">

              <!-- Top Section: Stats & Side to Play -->
              <app-tactics-stats
                [isLoggedIn]="!!currentUser()"
                [userRating]="userRating()"
                [ratingChange]="ratingChange()"
                [userStreak]="userStreak()"
                [userColor]="userColor()"
                [status]="status()"></app-tactics-stats>

              <!-- Middle Section: Puzzle Moves Notation (Hidden on mobile) -->
              <div class="hidden md:flex flex-1 flex-col min-h-0 overflow-hidden">
                @if (pgnMoves().length > 0) {
                <app-move-notation class="flex-1 overflow-y-auto" layout="grid" [moves]="pgnMoves()"
                  [currentFen]="currentFen()" [currentPly]="currentPly()" [initialFen]="currentPuzzle()?.fen || ''"
                  [initialPly]="puzzleStartPly()" [showNavigation]="false"
                  (navigate)="goToMove($event)"></app-move-notation>
                }
              </div>

              <!-- Bottom Section: Local Stockfish Engine Evaluation -->
              <app-tactics-analysis
                [fen]="currentFen()"
                [currentPly]="currentPly()"
                [status]="status()"
                [fenError]="fenError()"></app-tactics-analysis>

            </div>
          </div>

          <!-- Bottom Toolbar: History | Move Navigation | Next Puzzle -->
          <app-tactics-toolbar
            [isLoggedIn]="!!currentUser()"
            [recentAttempts]="recentPuzzleHistory()"
            [currentPuzzleId]="currentPuzzle()?.id"
            [currentPly]="currentPly()"
            [minPly]="puzzleStartPly()"
            [maxPly]="puzzleStartPly() + pgnMoves().length"
            [status]="status()"
            [isTransitioning]="isTransitioning()"
            (selectAttempt)="selectHistoryPuzzle($event)"
            (prevMove)="goToMove(currentPly() - 1)"
            (nextMove)="goToMove(currentPly() + 1)"
            (nextPuzzle)="loadNextPuzzle({ puzzleId: undefined, isReview: false, isNew: true })"></app-tactics-toolbar>
        </div>
      </div>
    </div>
    }
  </div>
</div>
