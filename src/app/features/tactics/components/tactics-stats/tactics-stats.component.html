<div class="p-4 md:p-6 flex flex-col gap-4 shrink-0">
  @if (isLoggedIn()) {
  <div class="flex items-center justify-between w-full">
    <!-- Rating & Streak (Left Group) -->
    <div class="flex items-center gap-4">
      <!-- Rating -->
      <div class="flex items-center gap-2">
        <span class="text-2xl font-medium">{{ userRating() }}</span>
        @if (status() !== 'playing' && ratingChange() !== null) {
        <span class="text-2xl font-medium" [class.text-green-500]="(ratingChange() || 0) > 0"
          [class.text-red-500]="(ratingChange() || 0) < 0">
          {{ (ratingChange() || 0) > 0 ? '+' : '' }}{{ ratingChange() }}
        </span>
        }
      </div>

      <!-- Streak -->
      <div class="flex items-center gap-1.5">
        <svg class="w-4 h-4 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z"
            clip-rule="evenodd" />
        </svg>
        <span class="text-2xl text-orange-400 font-semibold">{{ userStreak() }}</span>
      </div>
    </div>

    <!-- Color to Play (Right) -->
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400 font-medium capitalize">{{ userColor() }} to move</span>
      <div class="w-3.5 h-3.5 rounded-full shrink-0 border border-slate-300 shadow-xs"
        [class.bg-white]="userColor() === 'white'"
        [class.bg-slate-950]="userColor() === 'black'"></div>
    </div>
  </div>
  } @else {
  <div class="flex items-center justify-end w-full">
    <!-- Color to Play (Right) -->
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400 font-medium capitalize">{{ userColor() }} to move</span>
      <div class="w-3.5 h-3.5 rounded-full shrink-0 border border-slate-300 shadow-xs"
        [class.bg-white]="userColor() === 'white'"
        [class.bg-slate-950]="userColor() === 'black'"></div>
    </div>
  </div>
  }
</div>
