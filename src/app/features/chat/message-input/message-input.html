<div class="message-input-container p-3 border-t border-border-theme">
  <div class="flex items-start gap-2">
    <div class="flex-1 relative">
      <textarea
        #messageInput
        [value]="messageText()"
        (input)="onInputChange($event)"
        (keydown)="onKeyDown($event)"
        placeholder="Type a message..."
        rows="1"
        class="w-full resize-none rounded-xl border border-border-theme bg-slate-50  px-4 py-2.5 text-sm   placeholder-slate-400  outline-none focus:border-cyan-400 "
      ></textarea>
    </div>

    <button
      appButton
      variant="outline"
      [disabled]="!messageText().trim()"
      (click)="sendMessage()"
      class="mt-1"
    >
      Send
    </button>
  </div>
</div>
