<!-- Message List Container -->
<div 
  #scrollContainer
  class="flex-1 overflow-y-auto p-4 space-y-1 custom-scrollbar min-h-0"
  style="flex-basis: 0;"
>
  @if (isLoadingHistory()) {
    <div class="flex items-center justify-center h-full">
      <div class="w-4 h-4 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
    </div>
  } @else {
    @for (msg of messages(); track msg.timestamp + msg.senderId) {
      <div class="text-sm">
        <span 
          [appUserHovercard]="msg.senderName"
          class="font-medium hover:underline cursor-pointer"
        >{{ msg.senderName }}:</span>
        <span class="text-content ml-2">{{ msg.text }}</span>
      </div>
    }
  }
</div>

<!-- Input Area -->
<div class="p-4 bg-subtle border-t border-border-base">
  <form (submit)="sendMessage(); $event.preventDefault()" class="relative flex items-center gap-2">
    <input
      type="text"
      [(ngModel)]="newMessage"
      name="message"
      placeholder="type a message..."
      class="w-full bg-main border border-border-base rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-accent placeholder:text-muted/50"
      autocomplete="off"
    />
  </form>
</div>
