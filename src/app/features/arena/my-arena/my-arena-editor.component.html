<div class="max-w-4xl mx-auto px-4 py-8">
  <div class="mb-6">
    <app-back-link [link]="'/arena'" text="Back to Arenas"></app-back-link>
  </div>

  <div class="ui-panel w-full overflow-hidden rounded-xl">
    <div class="px-4 py-3 flex items-center justify-between border-b border-border-theme">
      <h2 class="text-xs font-semibold uppercase ">Create Arena Lobby</h2>
    </div>

    <form [formGroup]="arenaForm" (ngSubmit)="confirmSave()" class="p-4 lg:p-6 space-y-10">
      <!-- Time Controls Section -->
      <section>
        <h3 class="text-sm  uppercase mb-4">Time Format</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
          @for (tc of timeControls; track tc.value) {
            <button
              type="button"
              (click)="selectTimeControl(tc.value)"
              [attr.aria-pressed]="arenaForm.get('timeControl')?.value === tc.value"
              [class.bg-cyan-500]="arenaForm.get('timeControl')?.value === tc.value"
              [class.text-slate-900]="arenaForm.get('timeControl')?.value === tc.value"
              [class.border-cyan-500]="arenaForm.get('timeControl')?.value === tc.value"
              [class.bg-white/0.03]="arenaForm.get('timeControl')?.value !== tc.value"
              [class.border-border-theme]="arenaForm.get('timeControl')?.value !== tc.value"
              class="flex flex-col items-center justify-center py-3 border rounded-xl  cursor-pointer hover:bg-cyan-500/10 hover:border-cyan-500/30"
            >
              <span class="text-xl  er">{{ tc.label }}</span>
              <span class="text-[9px] font-semibold uppercase  ">{{
                tc.category
              }}</span>
            </button>
          }
        </div>
      </section>

      <!-- Details Section -->
      <section>
        <h3 class="text-sm  uppercase mb-6">Arena Settings</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Name -->
          <div class="space-y-3">
            <div class="flex justify-between items-end">
              <label class="block text-xs font-semibold uppercase  text-slate-500"
                >Arena Name</label
              >
              <span class="text-xs font-semibold uppercase text-slate-600">Optional</span>
            </div>
            <input
              type="text"
              formControlName="name"
              placeholder="e.g., Weekend Rapid Arena"
              class="w-full bg-white/5 border border-border-theme rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:border-cyan-500  placeholder:text-slate-600"
            />
          </div>

          <!-- Start Time -->
          <div class="space-y-3">
            <label class="block text-xs font-semibold uppercase  text-slate-500"
              >Start Time</label
            >
            <div class="relative">
              <select
                formControlName="startDateOffset"
                class="w-full bg-white/5 border border-border-theme rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:border-cyan-500  appearance-none cursor-pointer"
              >
                <option [value]="0.5">30 seconds (Testing)</option>
                <option [value]="5">5 minutes</option>
                <option [value]="10">10 minutes</option>
                <option [value]="30">30 minutes</option>
                <option [value]="60">1 hour</option>
                <option [value]="120">2 hours</option>
              </select>
            </div>
          </div>

          <!-- Duration slider -->
          <div class="space-y-4">
            <div class="flex justify-between items-end">
              <label class="block text-xs font-semibold uppercase  text-slate-500"
                >Duration (Minutes)</label
              >
              <span class="text-xl  text-cyan-500">{{
                arenaForm.get('durationMinutes')?.value
              }}</span>
            </div>
            <input
              type="range"
              formControlName="durationMinutes"
              min="3"
              max="360"
              step="1"
              class="w-full accent-cyan-500 cursor-pointer h-1.5"
            />
          </div>

          <!-- Rated Toggle (Static for now) -->
          <div
            class="flex items-center justify-between p-4 bg-white/5 border border-border-theme rounded-xl"
          >
            <div>
              <div class="text-xs font-semibold uppercase  text-slate-500 mb-1">
                Status
              </div>
              <div class="text-sm ">Rated Game</div>
            </div>
            <div
              class="w-10 h-5 bg-cyan-500 rounded-full flex items-center p-1 justify-end opacity-80 shadow-sm shadow-cyan-500/20"
            >
              <div class="w-3 h-3 bg-white rounded-full"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Actions -->
      <div class="pt-4">
        <button
          appButton
          variant="primary"
          [loading]="saving()"
          type="submit"
          class="  uppercase py-4"
        >
          Create Arena Lobby
        </button>
      </div>
    </form>
  </div>
</div>
