<!-- Mobile: show "not available" message -->
<div class="md:hidden h-full w-full flex flex-col items-center justify-center px-6 text-center">
  <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-white/5 flex items-center justify-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-slate-400 dark:text-slate-500">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
    </svg>
  </div>
  <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-2">Desktop Only</h2>
  <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed max-w-xs">
    This lesson view requires a larger screen. Please open this page on a tablet or desktop device.
  </p>
  <a
    routerLink="/roadmap"
    class="mt-6 inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 text-slate-700 dark:text-slate-300"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
    Back to Roadmap
  </a>
</div>

<!-- Desktop: full sidebar + content layout -->
<div class="hidden md:flex h-full w-full flex-col font-sans overflow-hidden">
  <div class="flex flex-1 w-full relative pr-4 pl-4 overflow-hidden">
    <app-sidebar
      [course]="course()"
      [activeLessonId]="activeLesson()?.id ?? ''"
      (lessonSelected)="onLessonSelected($event)"
      class="h-full w-80 z-10 shrink-0"
    >
    </app-sidebar>

    <div class="flex-1 overflow-y-auto w-full relative custom-scrollbar pl-4">
      @if (isLoadingCourse()) {
        <main class="w-full mx-auto p-2 min-h-full flex flex-col bg-transparent">
          <div class="shrink-0 top-4 z-20">
            <div class="flex justify-between items-center py-5">
              <div class="h-10 bg-slate-200 dark:bg-slate-800/80 rounded-lg w-1/3 sm:w-1/2"></div>
              <div class="flex gap-4">
                <div
                  class="h-10 w-24 bg-slate-200 dark:bg-slate-800/80 rounded-full hidden sm:block"
                ></div>
                <div
                  class="h-10 w-24 bg-slate-200 dark:bg-slate-800/80 rounded-full hidden sm:block"
                ></div>
              </div>
            </div>
          </div>

          <article class="max-w-5xl mb-12 shrink-0 mt-6">
            <div class="h-4 bg-slate-200 dark:bg-slate-800/80 rounded w-full mb-4"></div>
            <div class="h-4 bg-slate-200 dark:bg-slate-800/80 rounded w-11/12 mb-4"></div>
            <div class="h-4 bg-slate-200 dark:bg-slate-800/80 rounded w-4/5 mb-10"></div>

            <div
              class="flex flex-col mb-6 p-6 bg-slate-200 dark:bg-slate-800/30 rounded-2xl h-40"
            ></div>
          </article>
        </main>
      } @else if (course()) {
        <app-lesson-view
          [courseData]="course()"
          [lessonData]="activeLesson()"
          (startCourse)="onLessonSelected($event)"
          (nextLesson)="onNextLesson()"
          (prevLesson)="onPrevLesson()"
          (backToCourse)="onLessonSelected('')"
          class="block relative z-10 animate-fade-in"
        >
        </app-lesson-view>
      }
    </div>
  </div>
</div>
