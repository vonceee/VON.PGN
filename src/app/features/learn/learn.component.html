<!-- Mobile: show "not available" message -->
<div class="md:hidden h-full w-full flex flex-col items-center justify-center px-6 text-center">
  <div class="w-16 h-16 rounded-2xl bg-subtle  flex items-center justify-center mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
      class="w-8 h-8  ">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
    </svg>
  </div>
  <h2 class="text-lg font-semibold   mb-2">Desktop Only</h2>
  <p class="text-sm/6    max-w-xs">
    This lesson view requires a larger screen. Please open this page on a tablet or desktop device.
  </p>
  <a routerLink="/roadmap">Back to Roadmap</a>
</div>

<!-- Desktop: full sidebar + content layout -->
<div class="hidden md:flex h-full w-full flex-col overflow-hidden p-8">
  <div class="flex flex-1 w-full relative pr-4 pl-4 overflow-hidden">
    <app-sidebar [course]="course()" [activeLessonId]="activeLesson()?.id ?? ''"
      (lessonSelected)="onLessonSelected($event)" class="h-full w-80 z-10 shrink-0">
    </app-sidebar>

    <div class="flex-1 overflow-y-auto w-full relative pl-4">
      @if (isLoadingCourse()) {

      } @else if (course()) {
      <app-lesson-view [courseData]="course()" [lessonData]="activeLesson()" (startCourse)="onLessonSelected($event)"
        (nextLesson)="onNextLesson()" (prevLesson)="onPrevLesson()" (backToCourse)="onLessonSelected('')"
        class="block relative z-10 animate-">
      </app-lesson-view>
      }
    </div>
    <div class="hidden xl:block w-72 shrink-0"></div>
  </div>
</div>
