<div class="absolute inset-0 overflow-hidden flex flex-col bg-main">
  @if (study(); as s) {
    <!-- Main Content Grid Wrapper -->
    <div class="flex-1 w-full max-w-[1920px] mx-auto overflow-hidden p-4 lg:p-6 xl:p-8">
      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr_400px] xl:grid-cols-[350px_1fr_440px] 2xl:grid-cols-[380px_1fr_480px] gap-4 lg:gap-6 h-full overflow-hidden">
        
        <!-- Left Column: Sidebar -->
        <app-study-sidebar
          class="h-full overflow-hidden"
          [isLargeScreen]="isLargeScreen()"
          [isSyncing]="isSyncing()"
          [canEdit]="canEdit()"
        ></app-study-sidebar>

        <!-- Center Column: Board -->
        <div class="flex flex-col items-center justify-center overflow-hidden relative">
          @if (isEngineActive()) {
            <div class="lg:hidden w-full max-w-[800px] px-4 pb-2 animate-in fade-in slide-in-from-top-1 duration-300">
              <app-eval-bar [eval]="engineEval()" [orientation]="boardOrientation()" mode="horizontal"></app-eval-bar>
            </div>
          }

          <div class="flex-1 w-full flex items-center justify-center min-h-0 overflow-hidden relative board-container-parent">
            <div class="flex items-center justify-center gap-0 max-h-full">
              <app-chess-board
                [fen]="currentFen()"
                [orientation]="boardOrientation()"
                [interactive]="canEdit()"
                (moveMade)="onMoveMade($event)"
                (shapeDrawn)="onShapeDrawn($event)"
                (sizeChange)="boardSize.set($event)"
                [syncedShapes]="mergedShapes()"
                [lastMove]="lastMoveSquares()"
              ></app-chess-board>

              <div class="hidden lg:block h-[var(--board-size)] transition-all duration-500 ease-in-out"
                   [class.opacity-0]="!isEngineActive()" [class.invisible]="!isEngineActive()">
                <app-eval-bar [eval]="engineEval()" [orientation]="boardOrientation()" mode="vertical"></app-eval-bar>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Notation & Info -->
        <div class="h-full flex flex-col gap-2 overflow-hidden border-l border-border-base bg-surface/5 ui-panel">
          <!-- Sidebar Tabs -->
          <div class="flex border-b border-border-base">
            @for (tab of ['notation', 'info', 'chat']; track tab) {
              <button
                (click)="activeTab.set(tab === 'notation' ? 'notation' : tab === 'info' ? 'info' : 'chat')"
                class="flex-1 py-3 text-xs font-bold uppercase tracking-widest transition-all duration-300 relative after:absolute after:bottom-0 after:left-1/2 after:w-0 after:h-0.5 after:bg-accent after:-translate-x-1/2 after:transition-all after:duration-300"
                [class.text-accent]="activeTab() === tab"
                [class.opacity-50]="activeTab() !== tab"
                [class.after:w-full]="activeTab() === tab"
                [class.lg:hidden]="tab === 'chat'"
              >
                {{ tab }}
              </button>
            }
          </div>

          <div class="flex-1 flex flex-col overflow-hidden relative">
            @if (activeTab() === 'notation') {
              <app-study-analysis
                [isEngineActive]="isEngineActive()"
                [isEngineError]="isEngineError()"
                [engineEval]="engineEval()"
                [engineDepth]="engineDepth()"
                [formattedNps]="formattedNps()"
                [showEngineSettings]="showEngineSettings()"
                [multiPvCount]="multiPvCount()"
                [searchMode]="searchMode()"
                [enginePvLines]="enginePvLines()"
                [currentPly]="currentPly()"
                (toggleEngine)="toggleEngine()"
                (retryEngine)="onEngineRetry()"
                (toggleSettings)="toggleEngineSettings()"
                (multiPvChange)="onMultiPvChange($event)"
              ></app-study-analysis>

              <div class="flex-1 flex flex-col overflow-hidden">
                <app-move-notation
                  class="flex-1 overflow-y-auto custom-scrollbar"
                  [moveTree]="moveTree()"
                  [currentFen]="currentFen()"
                  [currentPly]="currentPly()"
                  [showNavigation]="true"
                  (nodeClicked)="onNodeClicked($event)"
                  (navigate)="onNavigateToPly($event)"
                  (deleteFromHere)="onDeleteFromHere($event)"
                ></app-move-notation>
              </div>
            } @else if (activeTab() === 'info') {
              <app-study-info
                [isOwner]="isOwner()"
                [canEdit]="canEdit()"
                [isSyncing]="isSyncing()"
                (syncToggle)="toggleSync()"
                (flipBoard)="flipBoard()"
              ></app-study-info>
            } @else if (activeTab() === 'chat') {
              <div class="flex-1 overflow-hidden lg:hidden">
                <app-study-chat class="flex-1 overflow-hidden"></app-study-chat>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  } @else if (isLoading()) {
    <div class="flex items-center justify-center min-h-[400px]">
      <div class="w-10 h-10 border-3 border-accent border-t-transparent rounded-full animate-spin"></div>
    </div>
  }

  @if (showDeleteModal() && study(); as s) {
    <app-confirm-delete-modal
      [itemName]="s.name"
      itemType="study"
      [loading]="isDeleting()"
      (confirm)="onDeleteConfirmed()"
      (cancel)="showDeleteModal.set(false)"
    ></app-confirm-delete-modal>
  }
</div>
