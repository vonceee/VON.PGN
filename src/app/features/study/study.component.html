<div class="absolute inset-0 overflow-hidden flex flex-col bg-main">
  @if (study(); as s) {
    <!-- Main Content Grid Wrapper -->
    <div class="flex-1 w-full max-w-[1600px] mx-auto overflow-hidden p-4 lg:p-6 xl:p-8">
      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr_400px] xl:grid-cols-[350px_1fr_440px] 2xl:grid-cols-[380px_1fr_480px] gap-4 lg:gap-6 h-full overflow-hidden">
        
        <!-- Left Column: Sidebar -->
        <app-study-sidebar
          class="h-full overflow-hidden"
          [isLargeScreen]="isLargeScreen()"
          [isSyncing]="isSyncing()"
          [canEdit]="canEdit()"
        ></app-study-sidebar>

        <!-- Center Column: Board -->
        <div class="flex flex-col items-center justify-center overflow-hidden relative">
          @if (isEngineVisible() && isEngineActive()) {
            <div class="lg:hidden w-full max-w-[800px] px-4 pb-2 animate-in fade-in slide-in-from-top-1 duration-300">
              <app-eval-bar [eval]="engineEval()" [orientation]="boardOrientation()" mode="horizontal"></app-eval-bar>
            </div>
          }

          <div class="flex-1 w-full flex items-center justify-center min-h-0 overflow-hidden relative board-container-parent">
            <div class="flex items-center justify-center gap-0 max-h-full w-full max-w-5xl mx-auto">
              <app-chess-board
                [fen]="currentFen()"
                [orientation]="boardOrientation()"
                [interactive]="canEdit()"
                (moveMade)="onMoveMade($event)"
                (shapeDrawn)="onShapeDrawn($event)"
                (sizeChange)="boardSize.set($event)"
                (prevMove)="onPrevMove()"
                (nextMove)="onNextMove()"
                [syncedShapes]="mergedShapes()"
                [lastMove]="lastMoveSquares()"
                [glyphs]="activeGlyphs()"
              ></app-chess-board>

              <div class="hidden lg:block h-[var(--board-size)] transition-all duration-500 ease-in-out"
                   [class.opacity-0]="!isEngineActive() || !isEngineVisible()" [class.invisible]="!isEngineActive() || !isEngineVisible()">
                <app-eval-bar [eval]="engineEval()" [orientation]="boardOrientation()" mode="vertical"></app-eval-bar>
              </div>
            </div>

          </div>
        </div>

        <!-- Right Column: Notation & Info -->
        <div class="h-full flex flex-col gap-4 overflow-hidden">
          <!-- Sidebar Pills (Outside Panel) -->
          <div class="flex items-center gap-2 px-1 shrink-0">
            <button
              appButton
              [variant]="activeTab() === 'notation' ? 'primary' : 'outline'"
              (click)="activeTab.set('notation')"
              class="capitalize"
            >
              Notation
            </button>
            <button
              appButton
              [variant]="activeTab() === 'info' ? 'primary' : 'outline'"
              (click)="activeTab.set('info')"
              class="capitalize"
            >
              Study Info
            </button>
            <button
              appButton
              [variant]="activeTab() === 'metadata' ? 'primary' : 'outline'"
              (click)="activeTab.set('metadata')"
              class="capitalize"
            >
              Metadata
            </button>
            <div class="flex-1"></div>
            <button
              appButton
              variant="ghost"
              (click)="openShortcuts()"
              title="Keyboard Shortcuts"
              class="!px-3 hover:!bg-accent/10 font-bold text-muted"
            >
              ?
            </button>
          </div>

          <!-- Main Content Panel -->
          <div class="flex-1 flex flex-col overflow-hidden bg-surface/5 ui-panel border-l border-border-base/50">
            <div class="flex-1 flex flex-col overflow-hidden relative">
              @if (activeTab() === 'notation') {
                @if (isEngineVisible()) {
                  <app-study-analysis
                    [isEngineActive]="isEngineActive()"
                    [isEngineError]="isEngineError()"
                    [engineEval]="engineEval()"
                    [engineDepth]="engineDepth()"
                    [formattedNps]="formattedNps()"
                    [showEngineSettings]="showEngineSettings()"
                    [multiPvCount]="multiPvCount()"
                    [searchMode]="searchMode()"
                    [enginePvLines]="enginePvLines()"
                    [currentPly]="currentPly()"
                    (toggleEngine)="toggleEngine()"
                    (retryEngine)="onEngineRetry()"
                    (toggleSettings)="toggleEngineSettings()"
                    (multiPvChange)="onMultiPvChange($event)"
                  ></app-study-analysis>
                }
  
                <app-study-metadata [chapter]="currentChapter()"></app-study-metadata>
  
                <app-move-notation
                  class="flex-1 overflow-y-auto custom-scrollbar"
                  [moveTree]="moveTree()"
                  [currentFen]="currentFen()"
                  [currentPly]="currentPly()"
                  [initialPly]="initialPly()"
                  [showNavigation]="true"
                  [result]="currentChapter()?.pgn_tags?.['Result']"
                  (nodeClicked)="onNodeClicked($event)"
                  (navigate)="onNavigateToPly($event)"
                  (deleteFromHere)="onDeleteFromHere($event)"
                  (annotateMove)="onAnnotateMove($event)"
                ></app-move-notation>
              } @else if (activeTab() === 'info') {
                <app-study-info
                  [isOwner]="isOwner()"
                  [canEdit]="canEdit()"
                  [isSyncing]="isSyncing()"
                  (syncToggle)="toggleSync()"
                ></app-study-info>
              } @else if (activeTab() === 'metadata') {
                <app-study-metadata-tab
                  [chapter]="currentChapter()"
                  [canEdit]="canEdit()"
                  (edit)="onEditMetadata()"
                ></app-study-metadata-tab>
              }
            </div>
          </div>

          <!-- Opening Explorer & Tablebase -->
          <div class="px-1">
            <app-explorer-box 
              [fen]="currentFen()" 
              [variant]="currentChapter()?.variant || 'standard'"
              [orientation]="boardOrientation()"
              (flipBoard)="flipBoard()"
            ></app-explorer-box>
          </div>
        </div>
      </div>
    </div>
  } @else if (isLoading()) {
    <div class="flex items-center justify-center min-h-96">
      <div class="w-10 h-10 border-3 border-accent border-t-transparent rounded-full animate-spin"></div>
    </div>
  }

  @if (showDeleteModal() && study(); as s) {
    <app-confirm-delete-modal
      [itemName]="s.name"
      itemType="study"
      [loading]="isDeleting()"
      (confirm)="onDeleteConfirmed()"
      (cancel)="showDeleteModal.set(false)"
    ></app-confirm-delete-modal>
  }
</div>
