<!-- Message List -->
<div #scrollContainer class="flex-1 overflow-y-auto min-h-0" style="flex-basis: 0;">
  @for (msg of messages(); track msg.timestamp + msg.senderId) {
  <div class="relative flex items-baseline gap-2 p-4 group">
    <span class="text-xs font-medium shrink-0">
      {{ msg.senderName }}:
    </span>
    <span class="text-sm break-words min-w-0">{{ msg.text }}</span>
    <span
      class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-muted/50 tabular-nums opacity-0 group-hover:opacity-100 transition-opacity">
      {{ formatTime(msg.timestamp) }}
    </span>
  </div>
  }
</div>

<!-- Input Area -->
<div class="flex-none select-none">
  <form (submit)="sendMessage(); $event.preventDefault()"
    class="flex border-t border-border-base items-center px-4 py-2.5">
    <input type="text" [(ngModel)]="newMessage" name="message" placeholder="send a message..."
      class="w-full bg-transparent text-sm placeholder:text-muted/50 focus:outline-none" autocomplete="off" />
  </form>
</div>
