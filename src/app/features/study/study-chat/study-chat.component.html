<div class="flex flex-col h-full bg-main overflow-hidden">
  <!-- Message List -->
  <div 
    #scrollContainer
    class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar"
  >
    @if (isLoadingHistory()) {
      <div class="flex items-center justify-center h-full">
        <div class="w-6 h-6 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
      </div>
    } @else if (messages().length === 0) {
      <div class="flex flex-col items-center justify-center h-full opacity-30 gap-4">
        <div class="p-4 rounded-full bg-surface border border-border-base">
          <ng-icon name="heroPaperAirplane" class="text-3xl"></ng-icon>
        </div>
        <p class="text-xs font-bold uppercase tracking-widest text-center px-8">
          Welcome to the lobby.<br>Start a conversation!
        </p>
      </div>
    } @else {
      @for (msg of messages(); track msg.timestamp + msg.senderId) {
        <div 
          class="flex flex-col gap-1"
          [class.items-end]="String(msg.senderId) === String(currentUserId())"
        >
          <div class="flex items-center gap-2 px-1">
            <span class="text-[10px] font-black text-muted uppercase tracking-tighter">
              {{ msg.senderName }}
            </span>
            <span class="text-[10px] text-muted/50">
              {{ formatTime(msg.timestamp) }}
            </span>
          </div>
          
          <div 
            class="max-w-[85%] px-3 py-2 rounded-2xl text-sm leading-relaxed break-words shadow-sm"
            [class]="String(msg.senderId) === String(currentUserId())
              ? 'bg-accent/10 text-accent border border-accent/20 rounded-tr-none'
              : 'bg-surface border border-border-base text-content rounded-tl-none'"
          >
            {{ msg.text }}
          </div>
        </div>
      }
    }
  </div>

  <!-- Input Area -->
  <div class="p-4 border-t border-border-base bg-surface">
    <form (submit)="sendMessage(); $event.preventDefault()" class="relative flex items-center gap-2">
      <input
        type="text"
        [(ngModel)]="newMessage"
        name="message"
        placeholder="Type a message..."
        class="w-full bg-main border border-border-base rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent/50 transition-all placeholder:text-muted/50"
        autocomplete="off"
      />
      <button
        appButton
        variant="primary"
        type="submit"
        class="!p-2 !rounded-xl !w-10 !h-10 flex items-center justify-center shrink-0"
        [disabled]="!newMessage().trim()"
      >
        <ng-icon name="heroPaperAirplane" class="text-lg"></ng-icon>
      </button>
    </form>
  </div>
</div>
