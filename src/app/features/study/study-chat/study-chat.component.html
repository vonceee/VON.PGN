<!-- Message List -->
<div
  #scrollContainer
  class="flex-1 overflow-y-auto min-h-0 custom-scrollbar"
  style="flex-basis: 0;"
>
  @if (isLoadingHistory()) {
    <div class="flex items-center justify-center h-full">
      <div class="w-6 h-6 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
    </div>
  } @else {
    @for (msg of messages(); track msg.timestamp + msg.senderId) {
      <div class="relative flex items-baseline gap-2 px-4 py-1 pr-14 hover:bg-border-base/20 group">
        <span
          class="text-xs font-semibold shrink-0 leading-5"
          [class]="String(msg.senderId) === String(currentUserId()) ? 'text-accent' : 'text-content'"
        >
          {{ msg.senderName }}:
        </span>
        <span class="text-sm text-content break-words min-w-0 leading-5">{{ msg.text }}</span>
        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-muted/50 tabular-nums opacity-0 group-hover:opacity-100 transition-opacity">
          {{ formatTime(msg.timestamp) }}
        </span>
      </div>
    }
  }
</div>

<!-- Input Area -->
<div class="flex-none px-4 py-3 border-t border-border-base/60">
  <form (submit)="sendMessage(); $event.preventDefault()">
    <input
      type="text"
      [(ngModel)]="newMessage"
      name="message"
      placeholder="send a message..."
      class="w-full bg-transparent text-sm text-content placeholder:text-muted/40 focus:outline-none"
      autocomplete="off"
    />
  </form>
</div>
