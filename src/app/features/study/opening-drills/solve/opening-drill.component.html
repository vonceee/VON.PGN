<div class="w-full h-full p-4 lg:p-8 flex flex-col relative overflow-hidden">
  <div class="w-full max-w-6xl mx-auto flex-1 flex flex-col lg:flex-row gap-8 items-stretch relative min-h-0">
    <!-- Left Column: Interactive Chess Board -->
    <div class="flex-1 flex items-center justify-center min-h-0 min-w-0 relative">
      <div
        class="board-container-parent w-full h-full max-w-[620px] max-h-[620px] flex items-center justify-center transition-all duration-300 rounded-3xl border border-transparent">
        <app-chess-board #board [fen]="boardFen()" [orientation]="boardOrientation()" [interactive]="boardInteractive()"
          [resizable]="false" [fluid]="false" (moveMade)="onStudentMove($event)"></app-chess-board>
      </div>
    </div>

    <!-- Right Column: Sidebar (Active controls or Completion summary) -->
    <div class="w-full lg:w-[400px] flex flex-col gap-4 shrink-0 min-h-0 lg:h-full lg:overflow-y-auto">
      @if (viewState() === 'active') {
      <app-drill-sidebar
        [selectedStudy]="selectedStudy()"
        [currentChapter]="currentChapter()"
        [accuracy]="drillAccuracy()"
        [currentPathIndex]="currentPathIndex()"
        [totalPaths]="drillPaths().length"
        [currentChapterIndex]="currentChapterIndex()"
        [totalChapters]="chapters().length"
        [lastMistake]="lastMistake()"
        [isRetryMode]="isRetryMode()"
        (pause)="quitActiveDrill()"
        (cancelRetry)="cancelRetry()"
      />
      } @else if (viewState() === 'success') {
      <app-drill-summary
        [studyId]="selectedStudy()?.id"
        [studyName]="selectedStudy()?.name"
        [accuracy]="drillAccuracy()"
        [correctCount]="correctCount()"
        [mistakes]="drillMistakes()"
        (restart)="restartRepertoire()"
        (backToSelection)="quitActiveDrill()"
      />
      }
    </div>
  </div>
</div>
