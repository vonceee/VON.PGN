<div class="min-h-0">
    @if (node() || facade.moveTree().length > 0) {
    <div class="flex-1 overflow-y-auto overflow-x-hidden space-y-5 text-sm/6  p-6">
        <!-- Glyphs Grid (Only for move selections) -->
        @if (node()) {
        <div class="space-y-2.5">
            <div class="grid grid-cols-4 gap-2 pt-1">
                @for (glyph of glyphs; track glyph.id; let idx = $index) {
                <button (click)="toggleGlyph(glyph.id)" [attr.aria-label]="glyph.name"
                    class="flex items-center justify-center h-10 rounded-xl cursor-pointer group relative text-md font-medium border-2 border-border-base">
                    {{ glyph.symbol }}

                    <!-- Tooltip -->
                    <div
                        class="absolute top-full left-1/2 -translate-x-1/2 mt-1.5 px-1 py-1 bg-slate-900 text-white border border-border-base rounded text-xs text-blue-600 whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none z-10 transition-opacity">
                        {{ glyph.name }}
                    </div>
                </button>
                }
            </div>
        </div>
        }

        <!-- Commentary text area -->
        <div class="space-y-2.5">
            <textarea [ngModel]="comment()" (ngModelChange)="comment.set($event)" (blur)="onSave()"
                [placeholder]="node() ? 'add text' : 'add text'" rows="6" [disabled]="!canEdit()"
                class="w-full px-4 py-3 border-2 border-border-base rounded-lg text-sm/6 outline-none resize-none"></textarea>
        </div>
    </div>

    <div class="p-6 shrink-0 flex justify-end gap-3">
        <button (click)="onCancel()"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white border border-border-base font-medium text-[16px] leading-5 cursor-pointer hover:bg-slate-200 transition-all">
            <span>Cancel</span>
        </button>
        <button (click)="onSave()" [disabled]="!canEdit()"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer">
            <span>Save</span>
        </button>
    </div>
    } @else {
    <div class="flex-1 flex flex-col items-center justify-center text-gray-500 p-8 text-center">
        <svg class="w-12 h-12 mb-3 text-gray-500/30" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="text-sm/6 font-medium">No moves in chapter</span>
        <span class="text-xs text-gray-500/60 mt-1">Make at least one move on the board to begin annotating.</span>
    </div>
    }
</div>
