<div class="flex-1 flex flex-col min-h-0 bg-main select-none p-6 rounded-lg">
    @if (node() || facade.moveTree().length > 0) {
    <div class="flex-1 overflow-y-auto overflow-x-hidden space-y-5 text-sm/6 pr-2">
        <!-- Glyphs Grid (Only for move selections) -->
        @if (node()) {
        <div class="space-y-2.5">
            <div class="grid grid-cols-4 gap-2 pt-1">
                @for (glyph of glyphs; track glyph.id; let idx = $index) {
                <button (click)="toggleGlyph(glyph.id)" [attr.aria-label]="glyph.name"
                    class="flex items-center justify-center h-10 rounded-xl cursor-pointer group relative text-md font-medium transition-all"
                    [class.bg-accent]="isSelected(glyph.id)" [class.text-white]="isSelected(glyph.id)"
                    [class.bg-subtle]="!isSelected(glyph.id)">
                    {{ glyph.symbol }}

                    <!-- Tooltip -->
                    <div
                        class="absolute top-full left-1/2 -translate-x-1/2 mt-1.5 px-1 py-1 bg-surface border border-border-base rounded text-xs text-accent whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none z-10 transition-opacity">
                        {{ glyph.name }}
                    </div>
                </button>
                }
            </div>
        </div>
        }

        <!-- Commentary text area -->
        <div class="space-y-2.5">
            <textarea [ngModel]="comment()" (ngModelChange)="comment.set($event)" (blur)="onSave()"
                [placeholder]="node() ? 'add your thoughts on this move..' : 'add a chapter introduction context...'" 
                rows="6" [disabled]="!canEdit()"
                class="w-full px-4 py-3 bg-subtle rounded-lg text-sm/6 outline-none resize-none focus:bg-subtle border border-transparent focus:border-border-base transition-colors"></textarea>
        </div>
    </div>

    <div class="flex-none pt-4 flex gap-3">
        <button appButton variant="outline" (click)="onCancel()" class="flex-1">
            Cancel
        </button>
        <button appButton variant="primary" (click)="onSave()" [disabled]="!canEdit()"
            class="flex-1 flex items-center justify-center gap-1.5">
            <span>Save</span>
        </button>
    </div>
    } @else {
    <div class="flex-1 flex flex-col items-center justify-center text-muted p-8 text-center">
        <svg class="w-12 h-12 mb-3 text-muted/30" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="text-sm/6 font-medium">No moves in chapter</span>
        <span class="text-xs text-muted/60 mt-1">Make at least one move on the board to begin annotating.</span>
    </div>
    }
</div>
