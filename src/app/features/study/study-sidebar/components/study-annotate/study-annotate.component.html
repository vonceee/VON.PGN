<div class="h-full flex flex-col min-h-0 overflow-hidden">
    @if (node() || facade.moveTree().length > 0) {
    <div class="flex-1 overflow-y-auto overflow-x-hidden p-4 space-y-5 text-sm/6 min-h-0">
        <!-- Sticky Top: Annotation Text Area -->
        <div class="sticky top-0 z-20 bg-white pt-2 pb-2 space-y-2.5">
            <app-text-area label="Annotation" [rows]="5" [(value)]="comment" (blur)="onSave()"
                [placeholder]="node() ? 'add text...' : 'add chapter introduction...'" [disabled]="!canEdit()"
                resize="none" class="w-full" />
        </div>

        <!-- Annotation Symbols Grid (Only for move selections) -->
        @if (node()) {
        <div class="space-y-2.5">
            <div class="grid grid-cols-5 gap-2 pt-1">
                @for (glyph of glyphs; track glyph.id; let idx = $index) {
                <button (click)="toggleGlyph(glyph.id)" [attr.aria-label]="glyph.name"
                    class="w-full aspect-square flex items-center justify-center rounded-xl cursor-pointer group relative text-base font-medium border transition-colors"
                    [class.bg-slate-900]="isSelected(glyph.id)" [class.text-white]="isSelected(glyph.id)"
                    [class.border-slate-900]="isSelected(glyph.id)" [class.bg-white]="!isSelected(glyph.id)"
                    [class.text-slate-800]="!isSelected(glyph.id)" [class.border-slate-200]="!isSelected(glyph.id)"
                    [class.hover:bg-slate-100]="!isSelected(glyph.id)">
                    <span>{{ glyph.symbol }}</span>
                </button>
                }
            </div>
        </div>
        }
    </div>

    <div class="p-6 shrink-0 flex justify-end gap-3">
        <button (click)="onCancel()"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white border border-slate-200 font-medium text-[16px] leading-5 cursor-pointer hover:bg-slate-200 transition-all">
            <span>Cancel</span>
        </button>
        <button (click)="onSave()" [disabled]="!canEdit()"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer">
            <span>Save</span>
        </button>
    </div>
    } @else {
    <div class="flex-1 flex flex-col items-center justify-center text-gray-500 p-8 text-center">
        <svg class="w-12 h-12 mb-3 text-gray-500/30" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="text-sm/6 font-medium">No moves in chapter</span>
        <span class="text-xs text-gray-500/60 mt-1">Make at least one move on the board to begin annotating.</span>
    </div>
    }
</div>
