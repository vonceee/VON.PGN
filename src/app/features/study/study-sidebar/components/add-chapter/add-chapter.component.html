<div class="flex-1 flex flex-col min-h-0 overflow-y-auto p-6 space-y-4">
  <!-- Chapter Name -->
  <div class="flex flex-col gap-2">
    <label for="chapter_name" class="font-medium text-sm/6">Chapter name</label>
    <input type="text" id="chapter_name" [ngModel]="newChapterName()" (ngModelChange)="newChapterName.set($event)"
      placeholder="e.g. Opening Analysis"
      class="w-full px-3 py-2 rounded-md text-sm/6 border border-border-base bg-surface outline-none placeholder:text-muted" />
  </div>

  <!-- Orientation (Hidden for PGN) -->
  @if (newChapterActiveTab() !== 'pgn') {
  <div class="flex flex-col gap-2">
    <label for="orientation" class="font-medium text-sm/6">Orientation</label>
    <div class="relative w-full">
      <select id="orientation" [value]="newChapterOrientation()"
        (change)="onOrientationChange($any($event.target).value)"
        class="w-full px-3 py-2 bg-surface border border-border-base rounded-md text-sm/6 appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
        style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
    </div>
  </div>
  }

  <!-- Chapter Source (Type) Dropdown -->
  <div class="flex flex-col gap-2">
    <label for="chapter_source" class="font-medium text-sm/6">Type</label>
    <div class="relative w-full">
      <select id="chapter_source" [value]="newChapterActiveTab()" (change)="onTabChange($any($event.target).value)"
        class="w-full px-3 py-2 bg-surface border border-border-base rounded-md text-sm/6 appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
        style="
          background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
          background-position: right 0.5rem center;
          background-size: 1.25rem;
        ">
        @for (tab of addChapterTabs; track tab.id) {
        <option [value]="tab.id">{{ tab.label }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Tab Content Area -->
  @if (newChapterActiveTab() === 'fen') {
  <div class="space-y-3">
    <input type="text" [ngModel]="newChapterFen()" (ngModelChange)="newChapterFen.set($event)"
      class="w-full px-3 py-2 rounded-md text-sm/6 border border-border-base bg-surface outline-none placeholder:text-muted" />
  </div>
  }

  @if (newChapterActiveTab() === 'pgn') {
  <div class="space-y-3">
    <div class="flex justify-between items-center">
      <input #fileInput type="file" multiple (change)="onNewChapterFilesSelected($event)" class="hidden" accept=".pgn">
      <button class="text-sm/6 text-purple-500 underline cursor-pointer font-medium" (click)="fileInput.click()"
        [disabled]="isReadingFiles()">
        @if (isReadingFiles()) {
        Loading...
        } @else {
        Upload .pgn files
        }
      </button>
    </div>

    <textarea [ngModel]="newChapterPgn()" (ngModelChange)="newChapterPgn.set($event)" rows="4"
      placeholder="Paste PGN here..."
      class="w-full px-3 py-2 rounded-md text-sm/6 border border-border-base bg-main outline-none resize-none placeholder:text-muted"></textarea>
  </div>
  }

  <!-- Actions Footer -->
  <div class="pt-6">
    <button
      class="whitespace-nowrap group flex items-center justify-center gap-2 px-5 py-2.5 text-md font-medium cursor-pointer bg-content text-main rounded-full"
      (click)="submitNewChapter()" [disabled]="!isNewChapterFormValid()">
      Create chapter
    </button>
  </div>
</div>
