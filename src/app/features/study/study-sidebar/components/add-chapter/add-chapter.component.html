<div class="min-h-0">
  <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
    <!-- Chapter Name -->
    <app-text-input
      id="chapter_name"
      label="Chapter name"
      [(ngModel)]="newChapterName"
      placeholder="e.g. Opening Analysis"
      class="w-full" />

    <!-- Orientation (Hidden for PGN) -->
    @if (newChapterActiveTab() !== 'pgn') {
      <app-select
        label="Orientation"
        [items]="orientationOptions"
        [(value)]="newChapterOrientation"
        class="w-full" />
    }

    <!-- Chapter Source (Type) Dropdown -->
    <app-select
      label="Type"
      [items]="chapterTabOptions"
      [(value)]="newChapterActiveTab"
      class="w-full" />

    <!-- Tab Content Area -->
    @if (newChapterActiveTab() === 'fen') {
      <app-text-input
        label="FEN"
        placeholder="Paste FEN..."
        [(ngModel)]="newChapterFen"
        class="w-full" />
    }

    @if (newChapterActiveTab() === 'pgn') {
    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <input #fileInput type="file" multiple (change)="onNewChapterFilesSelected($event)" class="hidden"
          accept=".pgn">
        <button class="text-sm/6 text-purple-500 underline cursor-pointer font-medium" (click)="fileInput.click()"
          [disabled]="isReadingFiles()">
          @if (isReadingFiles()) {
          Loading...
          } @else {
          Upload .pgn files
          }
        </button>
      </div>

      <textarea [ngModel]="newChapterPgn()" (ngModelChange)="newChapterPgn.set($event)" rows="4"
        placeholder="Paste PGN here..."
        class="w-full px-3 py-2 rounded-md text-sm/6 border border-slate-200 bg-white outline-none resize-none placeholder:text-gray-500"></textarea>
    </div>
    }
  </div>

  <!-- Actions Footer -->
  <div class="p-6 shrink-0 flex justify-end">
    <button
      class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer"
      (click)="submitNewChapter()" [disabled]="!isNewChapterFormValid()">
      Create
    </button>
  </div>
</div>
