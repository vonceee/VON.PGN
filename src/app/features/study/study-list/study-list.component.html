<div #pageContainer appFloatingCursorContainer
  class="w-full 2xl:max-w-7xl mx-auto flex justify-center min-h-screen relative selection:bg-blue-600 selection:text-white overflow-x-hidden">

  <div
    class="w-full grid grid-cols-1 md:grid-cols-[2rem_minmax(0,1fr)_2rem] lg:grid-cols-[2.75rem_minmax(0,1fr)_2.75rem] xl:grid-cols-[3.5rem_minmax(0,1fr)_3.5rem] relative">

    <aside
      class="hidden md:block md:col-start-1 md:col-end-2 border-x border-slate-200/90 relative pointer-events-none select-none z-10 w-full h-full overflow-hidden"
      aria-hidden="true">
      <svg class="w-full h-full stroke-slate-300/80" fill="none">
        <defs>
          <pattern id="diagonal-rail-study-left" width="14" height="14" patternUnits="userSpaceOnUse"
            patternTransform="rotate(-45)">
            <line x1="0" y1="0" x2="0" y2="14" stroke-width="1.15" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#diagonal-rail-study-left)" />
      </svg>
    </aside>

    <main class="relative z-10 w-full min-w-0 col-start-1 md:col-start-2 md:col-end-3 px-4 flex flex-col">

      <div class="structural-divider" aria-hidden="true">
        <div class="structural-divider-line"></div>
      </div>

      <!-- Controls & Filters Section -->
      <div class="py-6 sm:py-8">
        <!-- Navigation Tabs (Underlined Style) -->
        <div class="border-b border-slate-200 mb-6">
          <nav class="-mb-px flex gap-6 sm:gap-8 overflow-x-auto" aria-label="Study Sections">
            <button type="button" (click)="setTab('all')" [class.border-blue-600]="activeTab() === 'all'"
              [class.text-blue-600]="activeTab() === 'all'" [class.border-transparent]="activeTab() !== 'all'"
              [class.text-slate-500]="activeTab() !== 'all'"
              class="px-3 pb-3.5 text-sm font-semibold border-b-2 cursor-pointer transition-colors whitespace-nowrap flex items-center gap-1 hover:text-slate-900 hover:border-slate-300">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
                <path fill-rule="evenodd"
                  d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM6.262 6.072a8.25 8.25 0 0 1 10.562-.966 2.502 2.502 0 0 0-1.724 2.144 2.5 2.5 0 0 1-.958 1.83 2.5 2.5 0 0 0-.942 1.92v.3a2.5 2.5 0 0 1-2.5 2.5h-.75a.75.75 0 0 0-.75.75v1.2a2.5 2.5 0 0 1-.684 1.768c-.466.487-.958.91-1.472 1.267a8.25 8.25 0 0 1-.782-12.713Zm6.788 14.156a8.25 8.25 0 0 0 6.677-9.025 2.504 2.504 0 0 0-2.227-.203 2.5 2.5 0 0 1-2.5 0 2.503 2.503 0 0 0-2.45.18 2.5 2.5 0 0 1-2.6 0 2.503 2.503 0 0 0-2.45-.18 2.5 2.5 0 0 1-1.32.372c-.06 0-.12-.002-.18-.007a8.251 8.251 0 0 0 7.05 8.863Z"
                  clip-rule="evenodd" />
              </svg>
              Public Studies
            </button>

            @if (isLoggedIn()) {
            <button type="button" (click)="setTab('my')" [class.border-blue-600]="activeTab() === 'my'"
              [class.text-blue-600]="activeTab() === 'my'" [class.border-transparent]="activeTab() !== 'my'"
              [class.text-slate-500]="activeTab() !== 'my'"
              class="px-3 pb-3.5 text-sm font-semibold border-b-2 cursor-pointer transition-colors whitespace-nowrap flex items-center gap-1.5 hover:text-slate-900 hover:border-slate-300">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
                <path fill-rule="evenodd"
                  d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                  clip-rule="evenodd" />
              </svg>
              My Studies
            </button>
            }
          </nav>
        </div>

        <!-- Search & Filter Bar -->
        <div class="flex items-center gap-3">
          <app-text-input label="Search" placeholder="search studies..." [(ngModel)]="searchQuery" [hasPrefix]="true"
            [hasSuffix]="searchQuery().length > 0" class="flex-1 min-w-0">
            <svg prefix xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
              class="size-4 text-gray-500">
              <path fill-rule="evenodd"
                d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z"
                clip-rule="evenodd" />
            </svg>
            @if (searchQuery()) {
            <button suffix type="button" (click)="clearSearch()"
              class="text-gray-500 hover:text-slate-900 cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
                <path
                  d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
              </svg>
            </button>
            }
          </app-text-input>

          <!-- Categories Filter Dropdown (Hidden on Mobile Viewport) -->
          <app-select label="Category" [items]="categoryOptions" [(value)]="categoryFilter"
            class="hidden md:block w-52 shrink-0" />

          <!-- Create Study Button (Inline with Search) -->
          @if (isLoggedIn()) {
          <button
            class="inline-flex items-center justify-center w-11 h-11 shrink-0 rounded-xl cursor-pointer border border-slate-200 hover:bg-slate-50 transition-colors"
            (click)="createNewStudy()" title="Create study">
            <ng-icon name="heroPlus" size="1.25rem" class="shrink-0"></ng-icon>
          </button>
          }
        </div>
      </div>

      <div class="structural-divider" aria-hidden="true">
        <div class="structural-divider-line"></div>
      </div>

      <!-- Studies Content Area -->
      <div class="relative min-h-[400px] py-4 flex-1">
        <div class="flex flex-col gap-2 md:grid md:grid-cols-2 md:gap-6">
          @for (study of studies(); track study.id) {
          <div [appFloatingCursorTrigger]="getCategoryLabel(study.category)"
            [cursorIcon]="getCategoryIcon(study.category)" [routerLink]="'/study/' + study.id"
            class="bg-slate-900 text-white border rounded-md flex flex-col md:flex-row-reverse overflow-hidden hover:border-white/30 transition-all duration-200 cursor-pointer md:cursor-none group">
            <!-- Chess Board Preview Container (Desktop Only) -->
            <div
              class="hidden md:block board-container-parent md:w-50 aspect-square shrink-0 bg-surface relative overflow-hidden pointer-events-none">
              <div class="w-full h-full">
                @defer (on viewport) {
                <app-chess-board [fen]="getStudyFinalPosition(study).fen"
                  [lastMove]="getStudyFinalPosition(study).lastMove ?? undefined" [interactive]="false"
                  [resizable]="false" [hideCoordinates]="true" [fluid]="true" />
                } @placeholder {
                <div class="w-full h-full flex items-center justify-center bg-slate-200">

                </div>
                }
              </div>
            </div>

            <!-- Content -->
            <div class="flex-1 p-3.5 md:p-5 flex flex-col justify-between min-w-0">
              <div>
                <!-- Category Badge Row -->
                <div class="flex items-center gap-2 mb-2 md:mb-3.5">
                  <span class="text-sm font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-slate-200">
                    {{ getCategoryLabel(study.category) }}
                  </span>
                </div>

                <!-- Title -->
                <h2 class="text-base md:text-xl font-semibold text-white" [title]="study.name">
                  {{ study.name }}
                </h2>
              </div>
            </div>
          </div>
          }
        </div>
      </div>

      <!-- BOTTOM SYSTEM TERMINATION BOUNDARY (Slices across both gutters) -->
      <div class="structural-divider" aria-hidden="true">
        <div class="structural-divider-line"></div>
      </div>

    </main>

    <!-- COLUMN 3: RIGHT STRUCTURAL GUTTER RAIL (Architectural Diagonal Lines) -->
    <aside
      class="hidden md:block md:col-start-3 md:col-end-4 border-x border-slate-200/90 relative pointer-events-none select-none z-10 w-full h-full overflow-hidden"
      aria-hidden="true">
      <svg class="w-full h-full stroke-slate-300/80" fill="none">
        <defs>
          <pattern id="diagonal-rail-study-right" width="14" height="14" patternUnits="userSpaceOnUse"
            patternTransform="rotate(-45)">
            <line x1="0" y1="0" x2="0" y2="14" stroke-width="1.15" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#diagonal-rail-study-right)" />
      </svg>
    </aside>

  </div><!-- END 3-COLUMN STRUCTURAL LAYOUT -->

  <!-- Custom Floating Cursor -->
  <app-floating-cursor></app-floating-cursor>
</div>
