<div class="bg-main rounded-4xl w-full max-w-xl p-8 space-y-8 relative">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl">Create new study</h2>
  </div>

  <div class="space-y-4">
    <!-- Study Name -->
    <div class="flex flex-col gap-2">
      <label for="study_name" class="font-medium">Study name</label>
      <input type="text" id="study_name" [(ngModel)]="name" maxlength="100" placeholder="e.g. My Openings Analysis"
        class="w-full px-3 py-2.5 rounded-xl text-sm border border-border-base bg-main outline-none" autofocus />
    </div>

    <!-- Visibility -->
    <div class="flex flex-col gap-2">
      <label for="visibility" class="font-medium">Visibility</label>
      <div class="relative w-full">
        <select id="visibility" [value]="visibility()" (change)="visibility.set($any($event.target).value)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8"
          style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
          <option value="public">Public (Everyone can see)</option>
          <option value="unlisted">Unlisted (Hidden from search)</option>
          <option value="private">Private (Only me)</option>
        </select>
      </div>
    </div>

    <!-- Category Selection -->
    <div class="flex flex-col gap-2">
      <label for="category" class="font-medium">Category</label>
      <div class="relative w-full">
        <select id="category" [value]="category()" (change)="category.set($any($event.target).value)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8"
          style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
          <option value="general">General Study</option>
          <option value="opening_repertoire">Opening Repertoire</option>
        </select>
      </div>
    </div>

    <!-- Repertoire Orientation Selector (Only visible for Opening Repertoires) -->
    @if (category() === 'opening_repertoire') {
    <div class="space-y-2">
      <label class="font-medium">Repertoire Side (Default for Chapters)</label>
      <div class="flex gap-4">
        <button (click)="orientation.set('white')" type="button"
          class="flex-1 py-2.5 px-4 border border-border-base rounded-xl cursor-pointer hover:bg-subtle transition text-sm font-medium flex items-center justify-center gap-2"
          [class.border-accent]="orientation() === 'white'" [class.bg-accent/5]="orientation() === 'white'">
          <span class="w-2.5 h-2.5 rounded-full bg-subtle border border-slate-400"></span>
          White Repertoire
        </button>
        <button (click)="orientation.set('black')" type="button"
          class="flex-1 py-2.5 px-4 border border-border-base rounded-xl cursor-pointer hover:bg-subtle transition text-sm font-medium flex items-center justify-center gap-2"
          [class.border-accent]="orientation() === 'black'" [class.bg-accent/5]="orientation() === 'black'">
          <span class="w-2.5 h-2.5 rounded-full bg-content border border-slate-950"></span>
          Black Repertoire
        </button>
      </div>
    </div>
    }
  </div>

  <div class="pt-4 flex gap-4 w-full">
    <button appButton variant="outline" class="flex-1" (click)="dialogRef.close()">
      Cancel
    </button>
    <button appButton variant="primary" class="flex-1" (click)="onSubmit()" [disabled]="!name().trim()">
      Create study
    </button>
  </div>
</div>
