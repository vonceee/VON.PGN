<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" (click)="cancel.emit()">
  <div class="bg-white rounded-4xl w-full max-w-sm mx-4 p-8 space-y-8 relative" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex justify-between">
      <h2 class="text-2xl">
        a class is ongoing..
      </h2>
    </div>

    <!-- Body Content -->
    <div class="space-y-6">
      <!-- Feature list -->
      <ul class="space-y-3">
        <li class="flex items-start gap-3">
          <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-blue-600 shrink-0"></span>
          <span class="text-sm/6">The host will have full control of the board.</span>
        </li>
      </ul>
    </div>

    <!-- Footer Actions -->
    <div class="pt-4 flex gap-4 justify-end">
      <button class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white border border-border-base font-medium text-[16px] leading-5 cursor-pointer hover:bg-slate-200 transition-all"
       (click)="cancel.emit()">
        Explore Freely
      </button>
      <button class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer"
       (click)="confirm.emit()">
        Join Class
      </button>
    </div>
  </div>
</div>
