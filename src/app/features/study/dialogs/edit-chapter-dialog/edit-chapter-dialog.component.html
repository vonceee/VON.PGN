<div class="bg-white rounded-4xl w-full p-8 space-y-6 relative mx-auto">
  <!-- Header -->
  <h2 class="text-2xl">Edit chapter</h2>

  <!-- Body Content -->
  <div class="space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Chapter Name -->
      <app-text-input
        id="chapter_name"
        label="Chapter name"
        [(ngModel)]="name"
        placeholder="Chapter name"
        [autofocus]="true"
        (enter)="onSave()"
        class="w-full" />

      <!-- Orientation -->
      <app-select
        label="Orientation"
        [items]="orientationOptions"
        [(value)]="orientation"
        class="w-full" />
    </div>

    @if (!data.isLastChapter) {
    <div class="border-t border-slate-200 pt-4 space-y-4">
      <p class="text-sm/6 text-slate-500">
        Permanently delete this chapter, including all commentary and moves. This action cannot be undone.
      </p>

      @if (!isConfirmingDelete()) {
      <button
        type="button"
        class="whitespace-nowrap flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium cursor-pointer bg-red-50 border border-transparent rounded-full text-red-700 hover:bg-red-100 hover:text-red-800 transition-colors"
        (click)="isConfirmingDelete.set(true)">
        Delete chapter
      </button>
      } @else {
      <div class="flex flex-col gap-3">
        <label for="delete_confirm_input" class="text-sm/6 text-slate-500">
          Type <strong class="select-all font-semibold text-slate-800">{{ data.currentName }}</strong> to
          confirm deletion:
        </label>
        <app-text-input
          id="delete_confirm_input"
          label="Confirm chapter name"
          [(ngModel)]="deleteConfirmText"
          placeholder="Enter chapter name"
          [autofocus]="true"
          (enter)="deleteConfirmText() === data.currentName ? onDelete() : null"
          class="w-full" />
        <div class="flex gap-2">
          <button
            type="button"
            class="flex-1 whitespace-nowrap flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium cursor-pointer bg-red-50 border border-transparent rounded-full text-red-700 hover:bg-red-100 hover:text-red-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
            [disabled]="deleteConfirmText() !== data.currentName"
            (click)="onDelete()">
            Confirm delete
          </button>
          <button
            type="button"
            class="flex-1 whitespace-nowrap group flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium cursor-pointer bg-surface rounded-full hover:bg-slate-200 transition-colors"
            (click)="cancelDelete()">
            Cancel
          </button>
        </div>
      </div>
      }
    </div>
    }
  </div>

  <!-- Footer Actions -->
  <div class="pt-4 flex gap-4 w-full">
    <button
      type="button"
      (click)="dialogRef.close()"
      class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white/80 backdrop-blur-xs border border-slate-200 font-medium text-[16px] leading-5 hover:bg-slate-200 transition-all cursor-pointer">
      Cancel
    </button>
    <button
      type="button"
      (click)="onSave()"
      [disabled]="!name().trim() || isConfirmingDelete()"
      class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      Save changes
    </button>
  </div>
</div>
