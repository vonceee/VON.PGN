<div class="bg-white rounded-3xl md:rounded-4xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl relative mx-auto border border-slate-200/90">
  <!-- Header -->
  <div class="p-6 pb-4 border-b border-slate-200/90 flex flex-col gap-4 shrink-0 bg-white">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2.5 rounded-2xl bg-slate-100 text-slate-800 border border-slate-200/60 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.4" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-semibold text-slate-900 leading-tight">Study Settings</h2>
          <p class="text-xs text-slate-500 truncate max-w-sm">{{ study()?.name }}</p>
        </div>
      </div>

      <button type="button" (click)="dialogRef.close()"
        class="p-2 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"
        aria-label="Close dialog">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Segmented Pill Tabs Bar -->
    <nav class="flex items-center gap-1.5 p-1 bg-slate-100/90 rounded-2xl self-start border border-slate-200/60" role="tablist">
      <button type="button" role="tab"
        (click)="activeTab.set('general')"
        [attr.aria-selected]="activeTab() === 'general'"
        [class.bg-white]="activeTab() === 'general'"
        [class.text-slate-900]="activeTab() === 'general'"
        [class.shadow-xs]="activeTab() === 'general'"
        [class.text-slate-600]="activeTab() !== 'general'"
        class="px-4 py-1.5 rounded-xl text-sm font-medium transition-all cursor-pointer flex items-center gap-2">
        <span>General</span>
      </button>

      <button type="button" role="tab"
        (click)="activeTab.set('members')"
        [attr.aria-selected]="activeTab() === 'members'"
        [class.bg-white]="activeTab() === 'members'"
        [class.text-slate-900]="activeTab() === 'members'"
        [class.shadow-xs]="activeTab() === 'members'"
        [class.text-slate-600]="activeTab() !== 'members'"
        class="px-4 py-1.5 rounded-xl text-sm font-medium transition-all cursor-pointer flex items-center gap-2">
        <span>Members</span>
        @if (memberCount() > 0) {
          <span class="px-1.5 py-0.5 text-[11px] font-semibold bg-slate-200/80 rounded-full text-slate-700 leading-none">
            {{ memberCount() }}
          </span>
        }
      </button>

      <button type="button" role="tab"
        (click)="activeTab.set('export')"
        [attr.aria-selected]="activeTab() === 'export'"
        [class.bg-white]="activeTab() === 'export'"
        [class.text-slate-900]="activeTab() === 'export'"
        [class.shadow-xs]="activeTab() === 'export'"
        [class.text-slate-600]="activeTab() !== 'export'"
        class="px-4 py-1.5 rounded-xl text-sm font-medium transition-all cursor-pointer flex items-center gap-2">
        <span>Export</span>
      </button>
    </nav>
  </div>

  <!-- Tab Content Body (Scrollable) -->
  <div class="flex-1 overflow-y-auto min-h-0 bg-white flex flex-col">
    @switch (activeTab()) {
      @case ('general') {
        <app-study-settings
          [study]="study()"
          [isOwner]="isOwner()"
          [currentFen]="facade.currentFen()"
          (settingsSaved)="handleSettingsSaved($event)"
          (chatCleared)="handleChatCleared()"
          (studyDeleted)="handleStudyDeleted()"
          (cancelled)="dialogRef.close()">
        </app-study-settings>
      }
      @case ('members') {
        <div class="p-4 flex-1 flex flex-col min-h-0">
          <app-study-members
            [study]="study()"
            [isOwner]="isOwner()"
            [viewers]="viewerNames()"
            [isClassActive]="isClassActive()"
            [lockHolderId]="facade.lockHolderId()"
            (addMemberClicked)="addMember()"
            (removeMemberClicked)="removeMember($event)"
            (permissionChanged)="toggleMemberPermission($event.userId, $event.canEdit)"
            (grantControlClicked)="grantBoardControl($event)"
            (revokeControlClicked)="revokeBoardControl()">
          </app-study-members>
        </div>
      }
      @case ('export') {
        <div class="p-4 flex-1 flex flex-col min-h-0">
          <app-study-export
            [study]="study()"
            [isOwner]="isOwner()"
            [currentChapter]="currentChapter()"
            (exportPerformed)="handleExport($event)">
          </app-study-export>
        </div>
      }
    }
  </div>
</div>
