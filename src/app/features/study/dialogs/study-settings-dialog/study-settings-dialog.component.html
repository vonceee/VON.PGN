<div class="bg-main rounded-4xl w-full max-h-[90vh] flex flex-col relative overflow-hidden">
  <!-- Dialog Header -->
  <div class="p-8 pb-4 flex items-center justify-between shrink-0 border-b border-border-base/30">
    <h2 class="text-2xl font-sans">Study settings</h2>
  </div>

  <!-- Dialog Body (scrollable) -->
  <div class="flex-1 overflow-y-auto p-8 py-6 space-y-6">
    <!-- Study Name -->
    <div class="flex flex-col gap-2">
      <label for="study_name" class="font-medium">Study name</label>
      <input type="text" id="study_name" [ngModel]="name()" (ngModelChange)="name.set($event)" maxlength="100"
        placeholder="e.g. My Openings Analysis"
        class="w-full px-3 py-2.5 rounded-xl text-sm border border-border-base bg-main outline-none placeholder:text-muted/50" />
    </div>

    <!-- Visibility -->
    <div class="flex flex-col gap-2">
      <label for="visibility" class="font-medium">Visibility</label>
      <div class="relative w-full">
        <select id="visibility" [ngModel]="visibility()" (ngModelChange)="visibility.set($event)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
          style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
          <option value="public">Public (Everyone can see)</option>
          <option value="unlisted">Unlisted (Hidden from search)</option>
          <option value="private">Private (Only me)</option>
        </select>
      </div>
    </div>

    <!-- Engine Analysis Visibility -->
    <div class="flex flex-col gap-2">
      <label for="engine_visibility" class="font-medium">Engine analysis</label>
      <div class="relative w-full">
        <select id="engine_visibility" [ngModel]="engineVisibility()" (ngModelChange)="engineVisibility.set($event)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
          style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
          <option value="everyone">Everyone</option>
          <option value="owner">Only me</option>
        </select>
      </div>
    </div>

    <!-- Category Selection -->
    <div class="flex flex-col gap-2">
      <label for="category" class="font-medium">Category</label>
      <div class="relative w-full">
        <select id="category" [ngModel]="category()" (ngModelChange)="category.set($event)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
          style="
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
            background-position: right 0.5rem center;
            background-size: 1.25rem;
          ">
          <option value="general">General Study</option>
          <option value="opening_repertoire">Opening Repertoire</option>
        </select>
      </div>
    </div>

    <!-- Repertoire Side Selection (Only visible for repertoires) -->
    @if (category() === 'opening_repertoire') {
    <div class="flex flex-col gap-2">
      <label for="orientation" class="font-medium">Repertoire side (bulk updates chapters)</label>
      <div class="relative w-full">
        <select id="orientation" [ngModel]="orientation()" (ngModelChange)="orientation.set($event)"
          class="w-full px-3 py-2.5 bg-main border border-border-base rounded-xl text-sm appearance-none bg-no-repeat bg-right pr-8 focus:outline-none cursor-pointer"
          style="
              background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22 fill=%22%2394a3b8%22><path fill-rule=%22evenodd%22 d=%22M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z%22 clip-rule=%22evenodd%22 /></svg>');
              background-position: right 0.5rem center;
              background-size: 1.25rem;
            ">
          <option value="white">White Repertoire</option>
          <option value="black">Black Repertoire</option>
        </select>
      </div>
    </div>
    }
  </div>

  <!-- Dialog Footer -->
  <div class="p-8 pt-4 flex flex-col gap-3 w-full shrink-0 border-t border-border-base/50 bg-main">
    <div class="flex gap-4 w-full">
      <button appButton variant="ghost" class="!text-rose-500 hover:!bg-rose-500/10 flex-1" (click)="onDelete()">
        <span>Delete study</span>
      </button>

      <button appButton variant="ghost" class="hover:!bg-muted/10 flex-1" (click)="onClearChat()">
        <span>Clear chat lobby</span>
      </button>
    </div>

    <div class="pt-4 flex gap-4 w-full border-t border-border-base">
      <button appButton variant="outline" (click)="dialogRef.close()" class="flex-1">
        <span>Cancel</span>
      </button>
      <button appButton variant="primary" (click)="onSubmit()" [disabled]="!name().trim()" class="flex-1">
        <span>Save changes</span>
      </button>
    </div>
  </div>
</div>
