<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" (click)="cancel.emit()">
  <div class="bg-main rounded-4xl w-full max-w-md mx-4" (click)="$event.stopPropagation()">
    <div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-medium">Start class session</h2>
      </div>

      <!-- Feature list -->
      <ul class="space-y-3 mb-6">
        <li class="flex items-start gap-3">
          <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span>
          <span class="text-sm">Members will join and follow your board in real time.</span>
        </li>
        <li class="flex items-start gap-3">
          <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span>
          <span class="text-sm">You retain full board control.</span>
        </li>
        <li class="flex items-start gap-3">
          <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span>
          <span class="text-sm">Students can request board control to demonstrate a move.</span>
        </li>
        <li class="flex items-start gap-3">
          <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-accent shrink-0"></span>
          <span class="text-sm">End the session at any time by clicking the stop button.</span>
        </li>
      </ul>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 px-6 pb-6">
      <button appButton variant="outline" class="flex-1" (click)="cancel.emit()">
        Cancel
      </button>
      <button appButton variant="primary" class="flex-1" (click)="confirm.emit()">
        Start session
      </button>
    </div>
  </div>
</div>
