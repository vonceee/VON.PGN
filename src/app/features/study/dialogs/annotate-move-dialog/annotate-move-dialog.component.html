<div class="bg-main rounded-4xl w-full max-w-3xl p-8 space-y-8 relative mx-auto">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="text-2xl text-content">Annotate {{ node.san }}</h2>
    <button (click)="openShortcuts()" title="Keyboard Shortcuts"
      class="text-muted hover:text-content cursor-pointer transition-colors p-1 rounded-lg hover:bg-subtle shrink-0"
      type="button">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
      </svg>
    </button>
  </div>

  <!-- Body Content -->
  <div class="space-y-6">
    <!-- Glyphs Selection (Collapsible) -->
    <div class="space-y-3">
      <!-- Collapsible Header -->
      <div class="flex items-center justify-between cursor-pointer select-none py-1 group"
        (click)="toggleGlyphsExpanded()">
        <div class="flex items-center gap-3">
          <span class="text-sm font-medium text-muted group-hover:text-content transition-colors">(Glyphs)</span>
          @if (!isGlyphsExpanded() && selectedGlyphs().length > 0) {
          <div class="flex gap-1.5">
            @for (glyphId of selectedGlyphs(); track glyphId) {
            <span class="px-2 py-0.5 text-xs font-medium bg-accent text-white rounded-md">
              {{ getGlyphSymbol(glyphId) }}
            </span>
            }
          </div>
          }
        </div>
        <button type="button"
          class="text-muted group-hover:text-content p-1 rounded hover:bg-subtle transition-colors shrink-0">
          @if (isGlyphsExpanded()) {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
          </svg>
          } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
          }
        </button>
      </div>

      <!-- Collapsible Content -->
      @if (isGlyphsExpanded()) {
      <div class="grid grid-cols-6 sm:grid-cols-8 gap-2 pt-1">
        @for (glyph of glyphs; track glyph.id) {
        <button (click)="toggleGlyph(glyph.id)" [title]="glyph.name"
          class="flex items-center justify-center aspect-square rounded-4xl cursor-pointer group relative"
          [class.bg-accent]="isSelected(glyph.id)" [class.text-white]="isSelected(glyph.id)"
          [class.bg-subtle/50]="!isSelected(glyph.id)">
          <span class="text-lg font-medium">{{ glyph.symbol }}</span>

          <!-- Tooltip hint on hover -->
          <div
            class="absolute -top-8 left-1/2 -translate-x-1/2 px-2 py-1 bg-surface border border-border-base rounded text-xs whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none z-10">
            {{ glyph.name }}
          </div>
        </button>
        }
      </div>
      }
    </div>

    <!-- Comment Section -->
    <div class="space-y-3">
      <div class="relative group">
        <textarea #commentArea [ngModel]="comment()" (ngModelChange)="comment.set($event)"
          placeholder="add your thoughts on this move.." rows="4"
          class="w-full px-4 py-3 bg-subtle/50 rounded-2xl text-sm outline-none resize-none custom-scrollbar"
          autofocus></textarea>
        <div class="absolute inset-0 rounded-2xl opacity-0 group-focus-within:opacity-100 pointer-events-none"></div>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="pt-4 flex gap-4 w-full">
    <button appButton variant="outline" (click)="dialogRef.close()" class="flex-1">
      Cancel
    </button>
    <button appButton variant="primary" (click)="onSubmit()" class="flex-1 flex items-center justify-center gap-1.5">
      <span>Save annotation</span>
    </button>
  </div>
</div>
