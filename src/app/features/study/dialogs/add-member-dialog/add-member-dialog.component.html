<div class="bg-white rounded-4xl w-full max-w-md p-8 space-y-6 relative">
  <!-- Dialog Header -->
  <div class="pb-4 flex items-center justify-between">
    <h2 class="text-2xl">add user to study</h2>
  </div>

  <!-- Search & Results Section -->
  <div class="relative space-y-4">
    <input type="text" [ngModel]="searchQuery()" (ngModelChange)="onSearchChange($event)"
      placeholder="search..." autofocus
      class="block w-full pl-3 pr-3 py-2.5 bg-white border border-border-base rounded-xl text-sm/6 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600/50" />

    @if (isSearching()) {

      }

    <!-- Search Results Dropdown List -->
    @if (results().length > 0) {
    <div class="w-full bg-slate-200 rounded-3xl py-2 max-h-48 overflow-y-auto">
      @for (user of results(); track user.uid) {
      <button (click)="selectUser(user)"
        class="w-full flex items-center gap-3 px-5 py-3 text-left cursor-pointer transition-all border-b border-border-base last:border-0"
        [class.bg-blue-600/10]="selectedUser()?.uid === user.uid"
        [class.text-blue-600]="selectedUser()?.uid === user.uid"
        [class.hover:bg-white]="selectedUser()?.uid !== user.uid"
        [class.hover:text-blue-600]="selectedUser()?.uid !== user.uid">
        <div class="flex flex-col min-w-0">
          <span class="text-sm/6 font-medium truncate">{{ user.username }}</span>
        </div>
      </button>
      }
    </div>
    } @else if (searchQuery().length >= 2 && !isSearching()) {
    <div class="text-center py-6 text-sm/6 text-gray-500 bg-slate-200 rounded-3xl">
      user not found.
    </div>
    }
  </div>

  <!-- Selected User Preview -->
  @if (selectedUser(); as selected) {
  <div class="flex items-center justify-between bg-blue-600/5 px-4 py-2.5 rounded-2xl border border-blue-600/20">
    <div class="flex flex-col">
      <span class="text-xs text-gray-500">add user?</span>
      <span class="text-sm/6 font-semibold">{{ selected.username }}</span>
    </div>
    <button (click)="clearSelection()" class="text-gray-500 hover:text-rose-500 transition-colors p-1"
      title="Clear selection">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  }

  <!-- Actions -->
  <div class="flex gap-4 pt-4 justify-end">
    <button class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white border border-border-base font-medium text-[16px] leading-5 cursor-pointer hover:bg-slate-200 transition-all" (click)="dialogRef.close()">
      Cancel
    </button>
    <button class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer" [disabled]="!selectedUser()" (click)="addMember()">
      Confirm
    </button>
  </div>
</div>
