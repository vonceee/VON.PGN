<div class="bg-main rounded-4xl w-full max-w-md p-8 space-y-6 relative shadow-xl border border-border-base/50">
  <!-- Dialog Header -->
  <div class="flex items-center justify-between pb-2 border-b border-border-base/35">
    <h2 class="text-2xl">Add study member</h2>
    <button (click)="dialogRef.close()"
      class="text-muted hover:text-content cursor-pointer transition-colors p-1 rounded-lg hover:bg-subtle"
      title="Close">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Search & Results Section -->
  <div class="relative space-y-4">
    <div
      class="flex items-center h-11 w-full px-4 rounded-full bg-subtle border border-border-base focus-within:border-accent/40 focus-within:ring-1 focus-within:ring-accent/40 transition-all">
      <input type="text" [ngModel]="searchQuery()" (ngModelChange)="onSearchChange($event)"
        placeholder="search players..." autofocus
        class="bg-transparent outline-none text-sm font-medium placeholder-muted w-full" />

      @if (isSearching()) {
      <div class="w-4 h-4 border-2 border-accent border-t-transparent rounded-full animate-spin shrink-0 ml-2"></div>
      }
    </div>

    <!-- Search Results Dropdown List -->
    @if (results().length > 0) {
    <div
      class="w-full bg-subtle rounded-3xl border border-border-base/50 py-2 max-h-48 overflow-y-auto custom-scrollbar shadow-inner">
      @for (user of results(); track user.uid) {
      <button (click)="selectUser(user)"
        class="w-full flex items-center gap-3 px-5 py-3 hover:bg-main hover:text-accent text-left cursor-pointer transition-all border-b border-border-base/50 last:border-0">
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-medium truncate">{{ user.username }}</span>
        </div>
      </button>
      }
    </div>
    } @else if (searchQuery().length >= 2 && !isSearching()) {
    <div class="text-center py-6 text-sm text-muted bg-subtle rounded-3xl border border-border-base/50">
      No players found.
    </div>
    }
  </div>
</div>
