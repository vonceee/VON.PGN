<div class="px-4 md:px-16 py-8 relative max-w-7xl mx-auto">
  <header class="flex flex-row gap-6 mb-4">
    <h1 class="text-4xl md:text-5xl">Bughouse</h1>

    <!-- Navigation / Filter Tabs -->
    <div
      class="w-full overflow-x-auto no-scrollbar flex flex-nowrap md:flex-wrap items-center gap-3 self-start md:self-auto shrink-0 mb-8"
    >
      <button
        type="button"
        (click)="activeTab.set('broadcast')"
        [class]="
          activeTab() === 'broadcast'
            ? 'inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer shrink-0 transition-all'
            : 'inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-white/80 backdrop-blur-xs border border-slate-200 text-slate-900 font-medium text-[16px] leading-5 hover:bg-slate-200 transition-all cursor-pointer shrink-0'
        "
      >
        Broadcast
      </button>
      <button
        type="button"
        (click)="activeTab.set('lobby')"
        [class]="
          activeTab() === 'lobby'
            ? 'inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-slate-900 text-white font-medium text-[16px] leading-5 cursor-pointer shrink-0 transition-all'
            : 'inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-white/80 backdrop-blur-xs border border-slate-200 text-slate-900 font-medium text-[16px] leading-5 hover:bg-slate-200 transition-all cursor-pointer shrink-0'
        "
      >
        Lobby
      </button>
    </div>
  </header>


  <!-- ==================== BROADCAST / TV SECTION ==================== -->
  @if (activeTab() === 'broadcast') {
    <app-bughouse-broadcast></app-bughouse-broadcast>
  }

  <!-- ==================== LOBBY CARD SECTION ==================== -->
  @if (activeTab() === 'lobby') {
    <app-bughouse-lobby-card></app-bughouse-lobby-card>
  }
</div>
