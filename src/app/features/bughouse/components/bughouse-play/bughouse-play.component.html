<div class="w-full min-h-0 overflow-hidden">
  <!-- Boards Column -->
    <div class="flex flex-row justify-start items-center gap-6 p-8">
      <!-- ==================== BOARD A ==================== -->
      <app-bughouse-board
        #boardAComponent
        boardId="A"
        [fen]="gameStateService.boardAFen()"
        [orientation]="gameStateService.boardAOrientation()"
        [pocketW]="gameStateService.pocketA_W()"
        [pocketB]="gameStateService.pocketA_B()"
        [timeW]="gameStateService.timeA_W()"
        [timeB]="gameStateService.timeA_B()"
        [turn]="gameStateService.turnA()"
        [interactive]="gameStateService.gameActive() && !gameStateService.winner() && gameStateService.myBoard() === 'A' && gameStateService.turnA() === gameStateService.myColor()"
        [myBoard]="gameStateService.myBoard()"
        [myColor]="gameStateService.myColor()"
        [gameActive]="gameStateService.gameActive()"
        [winner]="gameStateService.winner()"
        [teamsState]="gameStateService.teamsState()"
        [whiteName]="gameStateService.teamsState().boards.boardA.white"
        [blackName]="gameStateService.teamsState().boards.boardA.black"
        [activeDropBoard]="gameStateService.activeDropBoard()"
        [activeDropPiece]="gameStateService.activeDropPiece()"
        [activeDropColor]="gameStateService.activeDropColor()"
        [cannibalVariant]="gameStateService.variant() === 'cannibal'"
        [lastPluckedSquare]="gameStateService.lastPluckedPiece()?.board === 'A' ? (gameStateService.lastPluckedPiece()?.square || null) : null"
        [isPromoting]="gameStateService.pendingCannibalPromotion()?.board === 'A'"
        [isRequisitionTargetBoard]="gameStateService.pendingCannibalPromotion()?.board === 'B'"
        [eligiblePluckSquares]="gameStateService.pendingCannibalPromotion()?.board === 'B' ? gameStateService.eligiblePluckSquares() : {}"
        (cannibalPromotionRequested)="gameStateService.pendingCannibalPromotion.set($event)"
        (pocketPieceSelectedForPromotion)="gameStateService.onPocketPieceSelectedForPromotion($event)"
        (pluckSquareClicked)="gameStateService.onPluckSquareClicked($event.board, $event.square)"
        (moveMade)="gameStateService.onBoardMoveMade('A', $event)"
        (startDropMode)="gameStateService.startDropMode($event.board, $event.piece, $event.color)"
        (pieceDropped)="gameStateService.onGridSquareClicked($event.board, $event.square)"
      >
      </app-bughouse-board>

      <!-- ==================== BOARD B ==================== -->
      <app-bughouse-board
        #boardBComponent
        boardId="B"
        [fen]="gameStateService.boardBFen()"
        [orientation]="gameStateService.boardBOrientation()"
        [pocketW]="gameStateService.pocketB_W()"
        [pocketB]="gameStateService.pocketB_B()"
        [timeW]="gameStateService.timeB_W()"
        [timeB]="gameStateService.timeB_B()"
        [turn]="gameStateService.turnB()"
        [interactive]="gameStateService.gameActive() && !gameStateService.winner() && gameStateService.myBoard() === 'B' && gameStateService.turnB() === gameStateService.myColor()"
        [myBoard]="gameStateService.myBoard()"
        [myColor]="gameStateService.myColor()"
        [gameActive]="gameStateService.gameActive()"
        [winner]="gameStateService.winner()"
        [teamsState]="gameStateService.teamsState()"
        [whiteName]="gameStateService.teamsState().boards.boardB.white"
        [blackName]="gameStateService.teamsState().boards.boardB.black"
        [activeDropBoard]="gameStateService.activeDropBoard()"
        [activeDropPiece]="gameStateService.activeDropPiece()"
        [activeDropColor]="gameStateService.activeDropColor()"
        [cannibalVariant]="gameStateService.variant() === 'cannibal'"
        [lastPluckedSquare]="gameStateService.lastPluckedPiece()?.board === 'B' ? (gameStateService.lastPluckedPiece()?.square || null) : null"
        [isPromoting]="gameStateService.pendingCannibalPromotion()?.board === 'B'"
        [isRequisitionTargetBoard]="gameStateService.pendingCannibalPromotion()?.board === 'A'"
        [eligiblePluckSquares]="gameStateService.pendingCannibalPromotion()?.board === 'A' ? gameStateService.eligiblePluckSquares() : {}"
        (cannibalPromotionRequested)="gameStateService.pendingCannibalPromotion.set($event)"
        (pocketPieceSelectedForPromotion)="gameStateService.onPocketPieceSelectedForPromotion($event)"
        (pluckSquareClicked)="gameStateService.onPluckSquareClicked($event.board, $event.square)"
        (moveMade)="gameStateService.onBoardMoveMade('B', $event)"
        (startDropMode)="gameStateService.startDropMode($event.board, $event.piece, $event.color)"
        (pieceDropped)="gameStateService.onGridSquareClicked($event.board, $event.square)"
      >
      </app-bughouse-board>

        <!-- Game Notation Column -->
      <app-bughouse-sidebar
        class="sync-bughouse-height"
        [isHost]="gameStateService.isCaptain()"
        [gameOverState]="gameStateService.gameOverState()"
        (offerRematch)="gameStateService.offerRematch()"
        (declineRematch)="gameStateService.declineRematch()"
        (startQueue)="gameStateService.startQueue()"
        (resign)="gameStateService.resign()"
        (offerDraw)="gameStateService.offerDraw()"
        (backToLobby)="gameStateService.exitToLobby()"
      ></app-bughouse-sidebar>
    </div>

</div>
