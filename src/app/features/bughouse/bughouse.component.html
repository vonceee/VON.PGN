<div
  appFloatingCursorContainer
  class="w-full max-w-[1850px] mx-auto pt-6 md:p-6 md:pl-25 2xl:pl-15"
  [class.px-4]="lobbyState() !== 'playing'"
  [class.md:px-16]="lobbyState() !== 'playing'"
  [class.py-8]="lobbyState() !== 'playing'"
  [class.h-full]="lobbyState() === 'playing'"
  [class.flex]="lobbyState() === 'playing'"
  [class.flex-col]="lobbyState() === 'playing'"
  [class.p-4]="lobbyState() === 'playing'"
  [class.md:p-6]="lobbyState() === 'playing'"
>
  @if (lobbyState() === 'lobby' || lobbyState() === 'queuing') {
    <app-bughouse-lobby
      [currentUserProfile]="currentUserProfile()"
      [partner]="partner()"
      [isHost]="isHost()"
      [searchResults]="searchResults()"
      [searchQuery]="searchQuery()"
      [isSearchingPlayers]="isSearchingPlayers()"
      [ongoingMatches]="ongoingMatches()"
      [isQueuing]="bughouseQueueService.isQueuing()"
      [tvState]="tvState()"
      (kickPartner)="kickPartner()"
      (leaveLobby)="exitToLobby()"
      (invitePlayer)="invitePlayer($event)"
      (searchInput)="onSearchInput($event)"
      (startQueue)="startQueue()"
      (cancelQueue)="cancelQueue()"
      (clearSearch)="clearSearch()"
      (spectateGame)="spectateGame($event)"
    >
    </app-bughouse-lobby>
  }

  <!-- ==================== MATCHED STATE ==================== -->
  @if (lobbyState() === 'matched') {
    <app-bughouse-matched
      [currentUserProfile]="currentUserProfile()"
      [partner]="partner()"
      [opponent1]="opponent1()"
      [opponent2]="opponent2()"
      [matchCountdown]="matchCountdown()"
    >
    </app-bughouse-matched>
  }

  <!-- ==================== PLAYING STATE ==================== -->
  @if (lobbyState() === 'playing') {
    <div class="w-full flex-1 grid grid-cols-1 xl:grid-cols-4 gap-6 min-h-0 overflow-hidden">
      <!-- Boards Column -->
      <div class="xl:col-span-3 flex-1 flex flex-col min-h-0 overflow-hidden">
        <div class="bughouse-boards-container flex-1 min-h-0 overflow-hidden w-full flex items-center justify-start gap-6">
          <!-- ==================== BOARD A ==================== -->
          <div class="flex items-center gap-2.5">
            <span class="text-4xl font-extrabold text-slate-300 select-none">1</span>
            <app-bughouse-board
              boardId="A"
              [fen]="boardAFen()"
              [orientation]="boardAOrientation()"
              [pocketW]="pocketA_W()"
              [pocketB]="pocketA_B()"
              [timeW]="timeA_W()"
              [timeB]="timeA_B()"
              [turn]="turnA()"
              [interactive]="gameActive() && !winner() && myBoard() === 'A' && turnA() === myColor()"
              [myBoard]="myBoard()"
              [myColor]="myColor()"
              [gameActive]="gameActive()"
              [winner]="winner()"
              [whiteName]="teamsState().boards.boardA.white"
              [blackName]="teamsState().boards.boardA.black"
              [activeDropBoard]="activeDropBoard()"
              [activeDropPiece]="activeDropPiece()"
              [activeDropColor]="activeDropColor()"
              [maxBoardSize]="maxBoardSize()"
              (moveMade)="onBoardMoveMade('A', $event)"
              (startDropMode)="startDropMode($event.board, $event.piece, $event.color)"
              (pieceDropped)="onGridSquareClicked($event.board, $event.square)"
            >
            </app-bughouse-board>
          </div>

          <!-- ==================== BOARD B ==================== -->
          <div class="flex items-center gap-2.5">
            <span class="text-4xl font-extrabold text-slate-300 select-none">2</span>
            <app-bughouse-board
              boardId="B"
              [fen]="boardBFen()"
              [orientation]="boardBOrientation()"
              [pocketW]="pocketB_W()"
              [pocketB]="pocketB_B()"
              [timeW]="timeB_W()"
              [timeB]="timeB_B()"
              [turn]="turnB()"
              [interactive]="gameActive() && !winner() && myBoard() === 'B' && turnB() === myColor()"
              [myBoard]="myBoard()"
              [myColor]="myColor()"
              [gameActive]="gameActive()"
              [winner]="winner()"
              [whiteName]="teamsState().boards.boardB.white"
              [blackName]="teamsState().boards.boardB.black"
              [activeDropBoard]="activeDropBoard()"
              [activeDropPiece]="activeDropPiece()"
              [activeDropColor]="activeDropColor()"
              [maxBoardSize]="maxBoardSize()"
              (moveMade)="onBoardMoveMade('B', $event)"
              (startDropMode)="startDropMode($event.board, $event.piece, $event.color)"
              (pieceDropped)="onGridSquareClicked($event.board, $event.square)"
            >
            </app-bughouse-board>
          </div>
        </div>
      </div>

      <!-- Game Notation Column -->
      <app-bughouse-sidebar
        [(activeSidebarTab)]="activeSidebarTab"
        [movesLog]="movesLog()"
        [isHost]="isHost()"
        [teamsState]="teamsState()"
        [gameOverState]="gameOverState()"
        (offerRematch)="offerRematch()"
        (declineRematch)="declineRematch()"
        (startQueue)="startQueue()"
      ></app-bughouse-sidebar>
    </div>
  }

  <!-- Temporary Banner Toast Notifications (Success / Warning / Info) -->
  @if (inviteNotification(); as notif) {
    <div class="fixed bottom-6 right-6 z-[110] pointer-events-none">
      <div
        class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border text-sm font-semibold"
        [class.bg-green-50]="notif.type === 'success'"
        [class.text-green-800]="notif.type === 'success'"
        [class.border-green-200]="notif.type === 'success'"
        [class.bg-rose-50]="notif.type === 'error'"
        [class.text-rose-800]="notif.type === 'error'"
        [class.border-rose-200]="notif.type === 'error'"
        [class.bg-slate-900]="notif.type === 'info'"
        [class.text-white]="notif.type === 'info'"
        [class.border-slate-800]="notif.type === 'info'"
      >
        @if (notif.type === 'success') {
          <ng-icon name="heroCheckCircle" class="text-green-600 text-lg shrink-0"></ng-icon>
        } @else if (notif.type === 'error') {
          <ng-icon name="heroXCircle" class="text-rose-600 text-lg shrink-0"></ng-icon>
        } @else {
          <ng-icon name="heroInformationCircle" class="text-blue-400 text-lg shrink-0"></ng-icon>
        }
        <span>{{ notif.message }}</span>
      </div>
    </div>
  }



  <!-- Custom Floating Cursor -->
  <app-floating-cursor></app-floating-cursor>
</div>
