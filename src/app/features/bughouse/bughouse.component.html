<div appFloatingCursorContainer>
  <!-- ==================== LOBBY & QUEUING STATE ==================== -->
  @if (gameStateService.lobbyState() === 'lobby' || gameStateService.lobbyState() === 'queuing') {
    <app-bughouse-lobby></app-bughouse-lobby>
  }

  <!-- ==================== PLAYING STATE ==================== -->
  @if (gameStateService.lobbyState() === 'playing') {
    <app-bughouse-play></app-bughouse-play>
  }

  <!-- Floating Queue Widget (visible while searching for match) -->
  <app-bughouse-queue></app-bughouse-queue>

  <!-- Toast Notification Alerts -->
  <app-bughouse-notification></app-bughouse-notification>

  <!-- Custom Floating Cursor -->
  <app-floating-cursor></app-floating-cursor>
</div>
