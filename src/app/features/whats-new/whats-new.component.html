<div class="min-h-full w-full flex flex-col overflow-x-hidden">
  <div class="flex-1 flex flex-col items-center pb-24 px-8">
    <div class="w-full max-w-3xl mt-4">
      <h1 class="text-4xl md:text-5xl mb-2">What's new</h1>
      <p class="text-muted text-lg mb-12">
        Changelog and release notes for vonchess.
      </p>

      <div class="space-y-16">
        @for (release of releases; track release.version) {
          <section>
            <!-- Release Header -->
            <div class="flex items-baseline gap-4 mb-6 pb-4 border-b border-border-base ">
              <h2 class="text-2xl font-semibold  ">v{{ release.version }}</h2>
              <span class="text-sm  ">{{ release.date }}</span>
            </div>

            <!-- Entries -->
            <div class="space-y-6">
              @for (entry of release.entries; track entry.title) {
                <div class="flex gap-4">
                  <span
                    class="shrink-0 mt-1 text-xs font-semibold uppercase px-2 py-0.5 rounded border {{ getCategoryColor(entry.category) }}"
                  >
                    {{ entry.category }}
                  </span>
                  <div>
                    <h3 class="text-lg font-semibold  ">{{ entry.title }}</h3>
                    <p class="text-slate-600  text-sm  mt-1">{{ entry.description }}</p>
                  </div>
                </div>
              }
            </div>
          </section>
        }
      </div>
    </div>
  </div>
</div>
