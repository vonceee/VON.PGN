<div class="h-full w-full flex flex-col overflow-x-hidden">
  <div class="flex-1 flex flex-col items-center pb-24 px-8">
    <div class="w-full max-w-3xl mt-4">
      <h1 class="text-5xl font-bold mb-4">What's New</h1>
      <p class="text-slate-500 dark:text-zinc-500 mb-12">
        Changelog and release notes for vonchess.
      </p>

      <div class="space-y-16">
        @for (release of releases; track release.version) {
          <section>
            <!-- Release Header -->
            <div class="flex items-baseline gap-4 mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
              <h2 class="text-2xl font-semibold text-slate-900 dark:text-white">v{{ release.version }}</h2>
              <span class="text-sm text-slate-500 dark:text-slate-400">{{ release.date }}</span>
            </div>

            <!-- Entries -->
            <div class="space-y-6">
              @for (entry of release.entries; track entry.title) {
                <div class="flex gap-4">
                  <span
                    class="shrink-0 mt-1 text-[11px] font-bold uppercase px-2 py-0.5 rounded border {{ getCategoryColor(entry.category) }}"
                  >
                    {{ entry.category }}
                  </span>
                  <div>
                    <h3 class="text-lg font-semibold text-slate-900 dark:text-white">{{ entry.title }}</h3>
                    <p class="text-slate-600 dark:text-zinc-400 text-sm leading-relaxed mt-1">{{ entry.description }}</p>
                  </div>
                </div>
              }
            </div>
          </section>
        }
      </div>
    </div>
  </div>
</div>
<app-footer />
