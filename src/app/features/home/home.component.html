<div #pageContainer appFloatingCursorContainer
  class="w-full min-h-screen relative py-8 px-4 md:px-0 md:pl-20 lg:pl-28 mx-auto selection:bg-blue-600 selection:text-white">

  <!-- =======================================================================
       Tailwind-Style Architectural Grid Lines System
       Inspired by tailwindcss.com blueprint layout & CAD developer aesthetic
       ======================================================================= -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <!-- Blueprint Orthogonal Background Matrix (48px square cells) -->
    <div class="tailwind-grid-bg"></div>
    <div class="tailwind-micro-grid"></div>

    <!-- Ambient Hero Lighting Halo -->
    <div class="tailwind-hero-glow"></div>
    <div class="tailwind-section-glow top-[1800px]"></div>
    <div class="tailwind-section-glow top-[3800px]"></div>

    <!-- Structural Vertical Guide Rails Framing Content -->
    <div class="tailwind-vertical-rail-left"></div>
    <div class="tailwind-vertical-rail-right"></div>

    <!-- Interior 4-Column Blueprint Guidelines (Dashed Guide Rails) -->
    <div class="tailwind-column-guides">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <app-scroll-scrubber [scrollPercent]="scrollPercent()" (scrollToTop)="scrollToSection('#heroSection')" />

  <div class="relative z-10">

    <!-- TOP SYSTEM COORDINATES BOUNDARY -->
    <div class="w-full md:pr-20 lg:pr-28 relative mb-6 md:mb-8 select-none pointer-events-none" aria-hidden="true">
      <div class="relative w-full border-t border-slate-200/80 before:absolute before:right-full before:top-0 before:w-6 md:before:w-16 before:border-t before:border-slate-200/60 after:absolute after:left-full after:top-0 after:w-6 md:after:w-16 after:border-t after:border-slate-200/60">
        <!-- Left Intersection Crosshair (+) -->
        <svg class="absolute -top-[7px] -left-[7px] w-3.5 h-3.5 text-slate-400 select-none pointer-events-none" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M7 0v14M0 7h14" />
        </svg>
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-2.5 py-0.5 rounded-full bg-white/95 border border-slate-200/90 shadow-2xs text-[10px] font-mono text-slate-400 uppercase flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>COORDINATES // A1 — H8</span>
        </div>
        <!-- Right Intersection Crosshair (+) -->
        <svg class="absolute -top-[7px] -right-[7px] w-3.5 h-3.5 text-slate-400 select-none pointer-events-none" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M7 0v14M0 7h14" />
        </svg>
      </div>
    </div>

    <!-- HERO SECTION -->
    <div id="heroSection">
      <app-hero-section #heroSection (exploreTools)="scrollToSection('#toolsSection')"
        (exploreGallery)="scrollToSection('#gallerySection')" />
    </div>

    <!-- TAILWIND GRID DIVIDER 01: HERO -> TOOLKIT -->
    <div class="w-full md:pr-20 lg:pr-28 relative my-8 md:my-14 select-none pointer-events-none" aria-hidden="true">
      <div class="relative w-full border-t border-slate-200/90 before:absolute before:right-full before:top-0 before:w-6 md:before:w-16 before:border-t before:border-slate-200/70 after:absolute after:left-full after:top-0 after:w-6 md:after:w-16 after:border-t after:border-slate-200/70">
        <!-- Left Intersection Crosshair (+) -->
        <svg class="absolute -top-[7px] -left-[7px] w-3.5 h-3.5 text-slate-400 select-none pointer-events-none" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M7 0v14M0 7h14" />
        </svg>
        <!-- Center Tech Badge -->
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-2.5 py-0.5 rounded-full bg-white/95 border border-slate-200/90 shadow-2xs text-[10px] font-mono text-slate-500 uppercase flex items-center gap-1.5">

        </svg>

    </div>
