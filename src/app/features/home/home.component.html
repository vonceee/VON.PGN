<div class="h-screen w-full flex flex-col overflow-x-hidden">
  <app-header></app-header>

  <!-- Main Scrollable Area -->
  <div class="flex-1 overflow-y-auto w-full custom-scrollbar">
    <!-- Hero Section -->
    <section class="w-full h-screen pb-20 px-6 flex flex-col items-center justify-center text-center">
      <h1 class="text-6xl md:text-7xl font-bold mb-4">Learn to play Chess</h1>
      <p
        class="text-xl md:text-2xl text-cyan-400 font-bold mb-8 decoration-white underline decoration-4 underline-offset-4">
        With the world's largest chess tutorials site.
      </p>

      <div class="w-full max-w-2xl flex gap-1 mb-6">
        <input type="text" placeholder="Search our tutorials, e.g. Sicilian Defense"
          class="flex-1 px-5 py-4 rounded-l-full text-slate-900 text-lg focus:outline-none bg-white" />
        <button
          class="bg-cyan-400 hover:bg-cyan-600 text-white px-8 py-4 rounded-r-full text-lg transition-colors flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
            stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </button>
      </div>

      <a href="/roadmap" class="hover:text-cyan-400 underline text-xl font-semibold mt-4">Not sure where to begin?</a>
    </section>

    <!-- Openings Section -->
    <section class="w-full h-screen py-20 px-6 flex flex-col items-center">
      <div class="max-w-6xl w-full flex flex-col md:flex-row items-center justify-between gap-12">
        <div class="md:w-1/2 text-center flex flex-col items-center">
          <h2 class="text-5xl md:text-6xl font-black mb-4">New to Chess?</h2>
          <p class="text-xl font-semibold mb-8">
            Master the basics of the game.
          </p>
          <a routerLink="/roadmap"
            class="bg-cyan-400 hover:bg-cyan-600 rounded-full px-12 py-4 font-bold text-xl transition-colors mb-4 w-64">Start
            Learning</a>
        </div>
        <div class="md:w-1/2 w-full">
          <div class="bg-white rounded-xl overflow-hidden">
            <div class="p-8 text-slate-800 text-lg space-y-4">

              <div class="mt-6 flex justify-center">
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tactics / Puzzles Section (Dark) -->
    <section class="w-full h-screen py-20 px-6 flex flex-col items-center">
      <div class="max-w-6xl w-full flex flex-col md:flex-row items-center justify-between gap-12">
        <div class="md:w-1/2 text-center flex flex-col items-center">
          <h2 class="text-5xl md:text-6xl font-black mb-4">Tactics</h2>
          <p class="text-xl font-bold mb-8">Forks, pins, skewers, and checkmates.</p>
          <a routerLink="/learn"
            class="bg-cyan-400 hover:bg-cyan-600 text-white rounded-full px-12 py-4 font-bold text-xl transition-colors mb-4 w-64 shadow-md">Solve
            Tactics</a>
        </div>
        <div class="md:w-1/2 w-full">
          
        </div>
      </div>
    </section>

    <!-- Global Footer -->
    <app-footer></app-footer>
  </div>
</div>
