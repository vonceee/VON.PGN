<!-- Toggles Section -->
<section id="toggles" class="mb-12">
  <h3 class="text-2xl mb-4 border-b-2 border-border-base pb-2">Toggles</h3>
  <!-- Toggle Showcase -->
  <div class="bg-slate-200 border border-border-base rounded-2xl p-8 mb-8">
    <div
      class="flex flex-wrap items-center gap-8 justify-center bg-white p-8 rounded-xl border border-border-base mb-6 shadow-sm">
      <div class="flex flex-col items-center gap-2">
        <app-toggle [checked]="isToggleActive()" (checkedChange)="isToggleActive.set($event)"></app-toggle>
        <span class="text-xs text-slate-900">Active Toggle: {{ isToggleActive() }}</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <app-toggle [checked]="true" [disabled]="true"></app-toggle>
        <span class="text-xs text-gray-500">Disabled (On)</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <app-toggle [checked]="false" [disabled]="true"></app-toggle>
        <span class="text-xs text-gray-500">Disabled (Off)</span>
      </div>
    </div>

    <pre
      class="bg-white border border-border-base rounded-2xl p-6 font-mono text-xs overflow-x-auto leading-relaxed shadow-sm"><code>&lt;!-- Simple toggle with two-way binding --&gt;
&lt;app-toggle [(checked)]="isToggled"&gt;&lt;/app-toggle&gt;

&lt;!-- Disabled toggle --&gt;
&lt;app-toggle [checked]="true" [disabled]="true"&gt;&lt;/app-toggle&gt;</code></pre>
  </div>
</section>
