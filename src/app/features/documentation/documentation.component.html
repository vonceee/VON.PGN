<div class="min-h-screen bg-white/50 backdrop-blur-xl flex flex-col md:flex-row">

  <!-- Sidebar Navigation -->
  <aside
    class="w-full md:w-64 lg:w-72 shrink-0 border-r border-border-base md:sticky overflow-y-auto px-6 py-8 bg-white">
    <div class="mb-8">
      <h2 class="text-xs font-semibold mb-4 px-3 text-muted">Documentation</h2>
      <nav class="space-y-1">
        <button *ngFor="let section of sections" (click)="scrollTo(section.id)"
          [class.bg-subtle]="activeSection === section.id" [class.text-content]="activeSection === section.id"
          [class.font-semibold]="activeSection === section.id" [class.text-muted]="activeSection !== section.id"
          class="w-full text-left px-3 py-2.5 text-sm rounded-lg hover:bg-subtle transition-all duration-150 flex items-center justify-between group cursor-pointer">
          <span>{{ section.title }}</span>
          <span *ngIf="activeSection === section.id" class="w-1.5 h-1.5 rounded-full bg-accent"></span>
        </button>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 py-12">
    <div class="max-w-4xl mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
