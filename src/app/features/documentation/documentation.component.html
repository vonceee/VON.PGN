<div class="min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigation -->
  <aside
    class="w-full md:w-64 lg:w-72 shrink-0 border-r-2 border-slate-200 md:sticky md:top-0 md:h-[calc(100vh-60px)] overflow-y-auto px-6 py-8 bg-white">

    <div class="mb-8">
      <nav class="space-y-1">
        @for (section of sections; track section.id) {
        <div class="flex flex-col">
          <button (click)="scrollTo(section.id)" [class.bg-slate-200]="activeSection === section.id"
            [class.font-semibold]="activeSection === section.id"
            class="w-full text-left px-3 py-2.5 text-sm rounded-lg hover:bg-slate-200 transition-all duration-150 flex items-center justify-between group cursor-pointer">
            <span>{{ section.title }}</span>
            @if (activeSection === section.id) {
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
            }
          </button>

          <!-- Subtopics -->
          @if (activeSection === section.id && section.subtopics) {
            <div class="ml-4 pl-3 border-l border-slate-200 mt-1 mb-2 space-y-1 flex flex-col">
              @for (sub of section.subtopics; track sub.id) {
              <button (click)="scrollToSubtopic(section.id, sub.id)"
                [class.font-semibold]="activeSubtopic === sub.id" class="w-full text-left py-1.5 text-xs cursor-pointer">
                {{ sub.title }}
              </button>
              }
            </div>
          }
        </div>
        }
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 py-12 px-6 md:px-12">
    <div class="max-w-4xl mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
