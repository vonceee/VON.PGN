<div class="ui-panel flex flex-col rounded-xl overflow-hidden">
  <div class="flex flex-col min-h-0">
    <!-- Header -->
    <div class="mb-2 h-10 flex items-center shrink-0 px-3">
      @if (gameService.isSearching()) {
        <div class="flex items-center justify-between w-full">
          <div class="flex items-center gap-3">
            <div
              class="h-3 w-3 border-2 border-cyan-500/30 border-t-cyan-500 rounded-full animate-spin"
            ></div>
            <span class="font-medium text-md">Searching...</span>
          </div>
          <button
            appButton
            variant="outline"
            (click)="cancelSearch()"
            class="text-xs"
          >
            Cancel
          </button>
        </div>
      } @else if (activeGameId()) {
        <div class="flex items-center justify-between w-full">
          <div class="flex items-center gap-3">
            <div class="h-2 w-2 rounded-full bg-cyan-500 "></div>
            <span class="font-medium text-md text-cyan-500">Active Game Found</span>
          </div>
          <button
            appButton
            variant="outline"
            (click)="rejoinGame()"
            class="text-xs"
          >
            Rejoin
          </button>
        </div>
      }
    </div>

    <!-- Content -->
    <div
      class="flex flex-col   items-center justify-center p-4 lg:p-6"
      [class.opacity-50]="gameService.isSearching()"
    >
      <div class="w-full max-w-[640px] flex flex-col gap-6">
        <!-- Time Control Grid -->
        <div class="grid gap-3 lg:gap-4">
          @for (category of categories; track category.key) {
            <div class="grid grid-cols-3 gap-3 lg:gap-4">
              @for (tc of category.controls; track tc.value) {
                @if (gameService.isSearching() && gameService.searchTimeControl() === tc.value) {
                  <div
                    class="flex flex-col items-center justify-center border-2 border-cyan-500 bg-cyan-500/10 rounded-xl relative overflow-hidden py-4 lg:py-6"
                  >
                    <div class="absolute inset-0 bg-cyan-500/10 "></div>
                    <div
                      class="h-6 w-6 rounded-full border-[3px] border-cyan-500/30 border-t-cyan-500 animate-spin"
                    ></div>
                  </div>
                } @else {
                  <button
                    appButton
                    (click)="seekGame(tc)"
                    [disabled]="gameService.isSearching()"
                    class="flex-col !h-auto !py-4 lg:!py-5 w-full !rounded-xl"
                  >
                    <span class="text-lg lg:text-xl  er">{{
                      tc.label
                    }}</span>
                    <span class="text-xs  uppercase tracking-widest opacity-60">{{
                      tc.category
                    }}</span>
                  </button>
                }
              }
            </div>
          }
        </div>

        <!-- Bottom Actions -->
        <div class="shrink-0 space-y-3">
          <button
            appButton
            variant="primary"
            (click)="openCustomTimeControl()"
            [disabled]="gameService.isSearching()"
            class="w-full !rounded-xl"
          >
            Custom Time Control
          </button>

          <button
            appButton
            variant="primary"
            (click)="playWithComputer()"
            [disabled]="gameService.isSearching()"
            class="w-full !rounded-xl"
          >
            Play with Computer
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
