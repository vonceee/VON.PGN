<section class="mb-20 min-h-full w-full bg-main flex flex-col">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 p-4">
    <div class="flex-1">
      <h1 class="text-4xl md:text-5xl mb-2 font-medium">Play</h1>
      <p class="text-muted text-lg">Find a match and play live chess.</p>
    </div>
  </header>
  <!-- Mobile Layout -->
  <div class="lg:hidden flex flex-col p-4 pb-12">
    <app-play-selector class="block w-full" />
  </div>

  <!-- Desktop Layout -->
  <div class="hidden lg:flex items-start flex-1 p-4">
    <div class="grid w-full grid-cols-1 lg:grid-cols-12 items-stretch gap-4">
      <!-- Left panel: Lobby/Seek board -->
      <div class="w-full lg:col-span-3">
        <app-seek-board (seekClicked)="onSeekClicked($event)" class="block" />
      </div>

      <!-- Middle panel: Play Selection (Wider) -->
      <div class="w-full lg:col-span-6">
        <app-play-selector />
      </div>

      <!-- Right panel: Top Matches Feed -->
      <div class="w-full lg:col-span-3">
        <app-top-matches />
      </div>
    </div>
  </div>
</section>
