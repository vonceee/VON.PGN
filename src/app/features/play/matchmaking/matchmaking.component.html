 <section class="h-full w-full bg-main">
  <!-- Mobile Layout -->
  <div class="lg:hidden flex flex-col h-[calc(100vh-120px)] p-4">
    <div class="flex-1 min-h-0">
      <app-play-selector class="block h-full" />
    </div>
  </div>

  <!-- Desktop Layout -->
  <div class="hidden lg:grid h-full max-w-7xl grid-cols-2 gap-4 lg:gap-8 p-4 lg:p-8 lg:py-6 mx-auto">
    <!-- Left panel: Play Selection -->
    <div class="h-full w-full min-h-0">
      <app-play-selector />
    </div>

    <!-- Right panel: Lobby/Seek board -->
    <div class="h-full min-h-0">
      <app-seek-board (seekClicked)="onSeekClicked($event)" class="block h-full" />
    </div>
  </div>
</section>
