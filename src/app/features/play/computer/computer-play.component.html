<div class="h-full w-full overflow-hidden flex flex-col bg-main p-4 md:p-8">
  @if (isSetup()) {
    <div class="flex flex-col items-center justify-center h-full ">
      <div class="h-12 w-12 border-4 border-accent/30 border-t-cyan-500 rounded-full animate-spin mb-4"></div>
      <p class="text-xs  uppercase  ">Preparing Challenge...</p>
    </div>
  } @else {
    <!-- ACTIVE GAME VIEW -->
    <div class="flex-1 flex items-center justify-center overflow-hidden   ">
      <div
        class="w-full max-w-[1920px] mx-auto h-full flex flex-col items-center md:grid md:grid-cols-[300px_1fr_350px] xl:grid-cols-[340px_1fr_400px] gap-4 md:gap-8 md:items-stretch overflow-hidden"
      >
        <!-- Left Column: Info & History -->
        <div class="hidden md:flex flex-col min-w-0 h-full w-full border-r border-border-base overflow-hidden">
          <div class="flex flex-col overflow-hidden h-full">
            <app-game-info
              [player]="opponentPlayer()"
              [color]="playerColor() === 'white' ? 'black' : 'white'"
              class="block mb-3"
            />
            <app-game-info
              [player]="mePlayer()"
              [color]="playerColor()"
            />

            <app-move-notation
              class="flex-1 pt-2"
              [moves]="pgnMoves()"
              [currentPly]="displayPly()"
              [showNavigation]="true"
              (navigate)="onNavigate($event)"
            />

            <div class="p-4 border-t border-border-base">
              @if (status() === 'playing') {
                <div class="flex gap-2">
                  @if (!showResignConfirm()) {
                    <button
                      appButton
                      variant="outline"
                      class="flex-1 font-semibold"
                      (click)="resignGame()"
                    >
                      Resign
                    </button>
                  } @else {
                    <button
                      appButton
                      variant="danger"
                      (click)="resignGame()"
                      class="flex-1 font-semibold"
                    >
                      Confirm Resign
                    </button>
                    <button
                      appButton
                      variant="ghost"
                      (click)="showResignConfirm.set(false)"
                      class="shrink-0"
                    >
                      Cancel
                    </button>
                  }
                </div>
              } @else {
                <button
                  appButton
                  variant="primary"
                  class="w-full font-semibold"
                  (click)="startGame()"
                >
                  New Game
                </button>
              }
            </div>
          </div>
        </div>

        <!-- Center Column: Board Area -->
        <div class="board-container-parent w-full md:w-auto flex flex-col items-center justify-center min-h-0 min-w-0 overflow-hidden relative">
          <!-- Mobile Info/Clock -->
          <div class="w-full md:hidden mb-2 flex items-center justify-between gap-2">
            <app-game-info
              [player]="opponentPlayer()"
              [color]="playerColor() === 'white' ? 'black' : 'white'"
              class="flex-1 min-w-0"
            />
            <app-chess-clock
              class="shrink-0 scale-75 origin-right"
              [serverTimeMs]="opponentTimeMs()"
              [serverTimestamp]="lastMoveTimestamp()"
              [isActive]="!isMyTurn()"
            />
          </div>

          <div
            class="relative w-full h-full flex items-center justify-center"
          >
            <app-chess-board
              #board
              [fen]="displayFen()"
              [orientation]="playerColor()"
              [interactive]="isMyTurn()"
              (moveMade)="onUserMove($event)"
              (sizeChange)="boardSize.set($event)"
            ></app-chess-board>
          </div>

          <!-- Mobile Info/Clock Bottom -->
          <div class="w-full md:hidden mt-2 flex items-center justify-between gap-2">
            <app-game-info
              [player]="mePlayer()"
              [color]="playerColor()"
              class="flex-1 min-w-0"
            />
            <app-chess-clock
              class="shrink-0 scale-75 origin-right"
              [serverTimeMs]="playerTimeMs()"
              [serverTimestamp]="lastMoveTimestamp()"
              [isActive]="isMyTurn()"
            />
          </div>
        </div>

        <!-- Right Column: Clocks (desktop) -->
        <div class="hidden md:flex flex-col min-w-0 h-full w-full border-l border-border-base overflow-hidden">
          <div class="flex flex-col justify-center gap-6 h-full px-4 lg:px-8">
            <!-- Computer Clock -->
            <div class="ui-panel p-3 flex flex-col gap-2">
              <app-chess-clock
                [serverTimeMs]="opponentTimeMs()"
                [serverTimestamp]="lastMoveTimestamp()"
                [isActive]="!isMyTurn()"
              />
            </div>

            <!-- Result Message in middle if finished -->
            @if (resultDetails(); as result) {
              <div class="ui-panel p-6 text-center border-border-base bg-white/5  zoom-in " aria-live="polite">
                <div class="text-3xl  mb-2 er text-main">{{ result.score }}</div>
                <div class="text-xs   uppercase font-semibold">
                  {{ result.label }}
                </div>
                <div class="text-sm mt-3 opacity-80">
                  {{ result.detail }}
                </div>
              </div>
            }

            <!-- Player Clock -->
            <div class="ui-panel p-3 flex flex-col gap-2">
              <app-chess-clock
                [serverTimeMs]="playerTimeMs()"
                [serverTimestamp]="lastMoveTimestamp()"
                [isActive]="isMyTurn()"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
