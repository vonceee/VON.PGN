<div class="tv-viewport" #viewport [class.is-dragging]="isDragging()">

  <div class="tv-canvas-plane" #canvasPlane>

    @for (item of canvasItems(); track item.game?.gameId || $index) {
    <div class="tv-game-card absolute transition-shadow duration-300 group" [style.left.px]="item.x"
      [style.top.px]="item.y" [class.cursor-pointer]="!item.game?.gameId?.startsWith('dummy')"
      [class.hover:shadow-[0_15px_40px_rgba(34,211,238,0.25)]]="!item.game?.gameId?.startsWith('dummy')"
      (click)="item.game?.gameId?.startsWith('dummy') ? null : goToGame(item.game?.gameId!)">

      <!-- Top Player (Black) -->
      <div class="flex items-center justify-between gap-4 mb-1"
        [class.invisible]="item.game?.gameId?.startsWith('dummy')">
        <app-game-info [player]="getGamePlayer(item.game?.black)" [color]="'black'" [showStatus]="false"
          class="flex-1 min-w-0" />
        <app-chess-clock class="shrink-0" [size]="'md'" [serverTimeMs]="item.game?.blackTimeRemainingMs || 0"
          [serverTimestamp]="item.game?.serverTimestamp || ''"
          [isActive]="item.game?.turn === 'black' && !item.game?.gameId?.startsWith('dummy')" />
      </div>

      <!-- Board -->
      <div class="board-wrapper relative w-[480px] h-[480px] shadow-lg rounded-sm">
        <app-chess-board [fen]="item.game?.fen || 'start'" [orientation]="'white'" [interactive]="false"
          [configOverride]="getCgConfig(item.game)" class="w-full h-full pointer-events-none block"></app-chess-board>

        <!-- Hover Overlay -->
        @if (!item.game?.gameId?.startsWith('dummy')) {
        <div
          class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
          <div
            class="px-8 py-3 rounded-full bg-slate-900/80 border border-accent/40 text-accent font-bold backdrop-blur-md shadow-[0_0_20px_rgba(34,211,238,0.2)] scale-90 group-hover:scale-100 transition-transform duration-300">
            SPECTATE
          </div>
        </div>
        }
      </div>

      <!-- Bottom Player (White) -->
      <div class="flex items-center justify-between gap-4 mt-1"
        [class.invisible]="item.game?.gameId?.startsWith('dummy')">
        <app-game-info [player]="getGamePlayer(item.game?.white)" [color]="'white'" [showStatus]="false"
          class="flex-1 min-w-0" />
        <app-chess-clock class="shrink-0" [size]="'md'" [serverTimeMs]="item.game?.whiteTimeRemainingMs || 0"
          [serverTimestamp]="item.game?.serverTimestamp || ''"
          [isActive]="item.game?.turn === 'white' && !item.game?.gameId?.startsWith('dummy')" />
      </div>
    </div>
    }
  </div>

  <!-- Reset Pan Control -->
  <div class="absolute bottom-8 right-8 flex flex-col gap-2 z-50">
    <button
      class="w-12 h-12 rounded-full bg-slate-800/90 backdrop-blur-md border border-border-theme/50 text-white hover:bg-slate-700 hover:border-accent/50 hover:text-accent transition-all flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.5)]"
      (click)="resetPan()" title="Reset to center">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
    </button>
  </div>
</div>
