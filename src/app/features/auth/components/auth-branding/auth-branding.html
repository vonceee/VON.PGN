<div
  class="hidden lg:flex bg-white lg:basis-3/5 p-10 flex-col relative overflow-hidden h-full w-full justify-between z-0">
  <!-- Glowing gradient background behind board -->
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[100px] pointer-events-none -z-10">
  </div>

  <!-- Content Header/Headline -->
  <div class="z-10 mt-8 mb-4">
    <app-typewriter-text size="text-3xl md:text-5xl font-medium text-center"
      text="free online chess — play, learn, and compete in tournaments anytime."></app-typewriter-text>
  </div>

  <!-- Animated Board -->
  <div class="flex-1 min-h-0 flex items-center justify-center w-full mx-auto my-8">
    <div class="h-full max-h-[500px] aspect-square rounded-lg overflow-hidden relative board-container-parent z-10">
      <app-chess-board [fen]="currentFen()" [lastMove]="currentLastMove()" [interactive]="false" [resizable]="false"
        [hideCoordinates]="true" [fluid]="true"></app-chess-board>
    </div>
  </div>
</div>
