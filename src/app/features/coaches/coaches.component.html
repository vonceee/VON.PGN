<div class="mx-auto px-8 py-10">
  <div class="mb-10">
    <h1 class="text-3xl font-bold mb-2">Find a Coach</h1>
    <p>Improve your game by training with top-rated players and experienced instructors.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    @for (coach of coaches(); track coach.id) {
      <div class="border border-border-theme rounded-2xl overflow-hidden transition-shadow flex h-full relative">
        <img [src]="coach.profilePicture" [alt]="coach.name" class="w-40 h-50 object-cover shrink-0">
        <div class="p-5 flex flex-col flex-1 min-w-0">
          <a [routerLink]="['/coaches', coach.id]"
             class="group absolute top-4 right-4 flex items-center gap-1 text-sm hover:text-cyan-400 transition-colors">
            <span>More Info</span>
            <svg class="transition-transform group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </a>
          <h2 class="text-lg font-bold flex items-center gap-2 mb-1">
            <span class="px-1.5 py-0.5 bg-red-600 text-white text-xs font-bold rounded">{{ coach.title }}</span>
            {{ coach.name }}
          </h2>
          <div class="text-sm text-slate-500 dark:text-slate-400 font-semibold mb-3">
            Rate: <span class="text-slate-900 dark:text-white">{{ coach.hourlyRate }}</span> / hr
          </div>
          <p class="text-slate-700 dark:text-slate-300 text-sm grow">
            {{ coach.shortInfo }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
