<div class="mx-auto px-4 md:px-8 py-6 md:py-10">
  <div class="mb-6 md:mb-10">
    <h1 class="text-2xl md:text-3xl font-bold mb-2">Find a Coach</h1>
    <p class="text-sm md:text-base">Improve your game by training with top-rated players and experienced instructors.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
    @for (coach of coaches(); track coach.id) {
      <div class="border border-border-theme rounded-2xl overflow-hidden flex flex-col md:flex-row h-full relative">
        <img [src]="coach.profilePicture" [alt]="coach.name" class="w-full md:w-40 h-48 md:h-50 object-cover shrink-0">
        <div class="p-4 md:p-5 flex flex-col flex-1 min-w-0">
          <app-button
            variant="ghost"
            size="sm"
            [link]="'/coaches/' + coach.id"
            [showArrow]="true"
            label="More Info"
            class="self-start md:absolute md:top-4 md:right-4 mb-2 md:mb-0"
          />
          <h2 class="text-base md:text-lg font-bold flex items-center gap-2 mb-1">
            <span class="px-1.5 py-0.5 bg-red-600 text-white text-xs font-bold rounded shrink-0">{{ coach.title }}</span>
            <span class="truncate">{{ coach.name }}</span>
          </h2>
          
          <p class="mt-4 text-sm grow">
            {{ coach.shortInfo }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
