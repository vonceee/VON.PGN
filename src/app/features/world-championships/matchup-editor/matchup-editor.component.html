<div class="px-4 sm:px-6 lg:px-8 py-6 mx-auto">
  <!-- Top Navigation & Action Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-3">
      <!-- Notification Toast -->
      @if (saveStatusMessage()) {
      <div
        class="bg-emerald-50 text-emerald-800 text-xs px-3 py-1.5 rounded-xl border border-emerald-200 font-medium animate-fade-in">
        {{ saveStatusMessage() }}
      </div>
      }
    </div>

    <!-- Top Action Buttons -->
    <div class="flex flex-wrap items-center gap-2">
      <button (click)="saveDraft()"
        class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 transition-colors flex items-center gap-1 cursor-pointer">
        Save Draft
      </button>

      <button (click)="publishStory()"
        class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white transition-colors flex items-center gap-1 shadow-sm cursor-pointer">
        Publish &amp; View
      </button>
    </div>
  </div>

  <!-- Main Split Layout (Direct In-Place Editing) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-y-8 lg:gap-y-0">

    <!-- LEFT COLUMN: "Blog" (Header Card, Scorecard Table, and Story Sections Editor) -->
    <div class="bg-white lg:col-span-7 xl:col-span-8 p-6 sm:p-8 lg:p-10 space-y-6">

      <!-- Article Header Card: Championship Title, Subtitle, Venue, Game Selector -->
      <header class="space-y-4">
        <!-- Line 1: Championship Title (e.g. "2024 World Chess Championship") -->
        <div class="flex items-center justify-between gap-3">
          <input type="text" [(ngModel)]="championshipTitle" placeholder="Event"
            class="text-2xl sm:text-3xl font-bold text-slate-900 hover:bg-slate-50 focus:bg-white px-2 py-1 -ml-2 rounded-lg border border-transparent hover:border-slate-200 focus:border-slate-300 transition-colors flex-1"
            title="Event" />
        </div>

        <!-- Line 2: Contenders / Subtitle & Venue / Host alongside Game Selector Dropdown -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-2">
          <div class="flex-1">
            <h2 class="text-lg sm:text-xl font-medium text-slate-700 mb-2 select-none" title="Contenders">
              @if (champion() || challenger()) {
                {{ champion() || 'Defender' }} vs. {{ challenger() || 'Challenger' }}
              } @else {
                <span class="text-slate-400">Defender vs. Challenger</span>
              }
            </h2>
            <input type="text" [(ngModel)]="location" placeholder="Venue / Host City"
              class="text-sm text-gray-500 hover:bg-slate-50 focus:bg-white px-2 py-1 -ml-2 rounded-lg border border-transparent hover:border-slate-200 focus:border-slate-300 transition-colors w-full"
              title="Venue / Host City" />
          </div>

          <div class="flex items-center gap-2 w-auto">
            @if (gameNumberOptions().length > 0) {
            <div class="w-52">
              <app-select label="" placeholder="Select Game..." [items]="gameNumberOptions()"
                [value]="selectedGameNumber()" (itemSelected)="onSelectGameNumber($event.value!)" />
            </div>
            }
          </div>
        </div>
      </header>

      <!-- Scorecard Cross-Table Display (Interactive & In-Place Editable) -->
      <div class="space-y-2">
        <app-wcc-scorecard [match]="activeMatch()" [gamesSummary]="gamesSummary()"
          [selectedGameNumber]="selectedGameNumber() || 1" [isEditable]="true"
          (championChange)="onChampionChange($event)" (challengerChange)="onChallengerChange($event)"
          (addGame)="addNewGame()" (gameSelected)="onSelectGameNumber($event)"></app-wcc-scorecard>
      </div>

      <!-- Modular Editorial Story & Sections Editor -->
      <app-wcc-section-editor [(overview)]="narrativeOverview" [(sections)]="sections" [maxPly]="maxPly()"
        [currentPly]="currentPly()" [currentMoveLabel]="currentMoveLabel()" [moveHistory]="moveHistory()"
        (plySelected)="goToPly($event)" (annotationChanged)="onAnnotationChanged($event)"
        (deleteFromHere)="onDeleteFromHere($event)"></app-wcc-section-editor>
    </div>

    <!-- RIGHT COLUMN: "Chess Board" (Sticky Interactive Board & Move Toolbar) -->
    <div
      class="lg:col-span-5 xl:col-span-4 border-t-2 lg:border-t-0 lg:border-l-2 border-slate-200 pt-6 lg:pt-0 lg:pl-10">
      <div class="sticky top-6">
        <app-wcc-board-viewer [fen]="currentFen()" [orientation]="boardOrientation()" [currentPly]="currentPly()"
          [maxPly]="maxPly()" [moveLabel]="currentMoveLabel()" [interactive]="true" [isEditor]="true"
          (goToFirst)="goToFirst()" (prev)="prevMove()" (next)="nextMove()" (goToLast)="goToLast()" (flip)="flipBoard()"
          (moveMade)="onBoardMoveMade($event)" (undoMove)="undoLastBoardMove()"
          (annotateMove)="annotateCurrentMove()"></app-wcc-board-viewer>
      </div>
    </div>

  </div>
</div>
