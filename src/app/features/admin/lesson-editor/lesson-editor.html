<div class="max-w-[1200px]">
  <div class="flex justify-between items-center mb-6 pb-4 border-b border-border-base">
    <div>
      <h1 class="text-2xl font-semibold ">{{ lessonId() ? 'Edit Lesson' : 'New Lesson' }}</h1>
    </div>
    <button [disabled]="saving() || lessonForm.invalid" (click)="saveLesson()" class="inline-block px-4 py-2 rounded-md text-sm   bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50">
      {{ saving() ? 'Saving...' : 'Save Lesson' }}
    </button>
  </div>

  <div *ngIf="loading()" class="bg-white border border-border-base rounded-lg p-12 text-center">
    <p>Loading lesson...</p>
  </div>

  <div *ngIf="!loading()">
    <div class="bg-white border border-border-base rounded-lg p-5 mb-4">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-border-base">
        <h2 class="text-base font-semibold  m-0">Lesson Details</h2>
      </div>
      <form [formGroup]="lessonForm" (ngSubmit)="saveLesson()">
        <div class="mb-4">
          <label class="block text-sm  text-muted mb-1.5">Title</label>
          <input type="text" formControlName="title" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none " placeholder="e.g. The Pawn" />
        </div>

        <div class="mb-4">
          <label class="block text-sm  text-muted mb-1.5">Slug (optional)</label>
          <input type="text" formControlName="slug" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none " placeholder="e.g. the-pawn" />
        </div>

        <div class="mb-0">
          <label class="block text-sm  text-muted mb-1.5">Order</label>
          <input type="number" formControlName="order" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none " min="1" />
        </div>
      </form>
    </div>

    <div class="bg-white border border-border-base rounded-lg p-5 mb-4">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-border-base">
        <h2 class="text-base font-semibold  m-0">Content Blocks</h2>
      </div>
      <div class="flex gap-4 mb-4">
        <button type="button" (click)="addTextBlock()" class="inline-block px-4 py-2 rounded text-sm   bg-subtle text-content hover:bg-subtle">+ Text Block</button>
        <button type="button" (click)="addBoardBlock()" class="inline-block px-4 py-2 rounded text-sm   bg-subtle text-content hover:bg-subtle">+ Board Block</button>
      </div>

      <div formArrayName="content_blocks">
        <ng-container *ngFor="let block of contentBlocks.controls; let i = index">
          <div [formGroupName]="i" class="bg-white border border-border-base rounded-lg p-5 mb-4" style="background: #fafafa;">
            <div class="flex justify-between items-center mb-4">
              <span class="inline-block px-2 py-1 text-xs font-semibold rounded uppercase bg-subtle text-content">{{ block.get('type')?.value }}</span>
              <div class="flex gap-2">
                <button type="button" (click)="moveBlock(i, -1)" [disabled]="i === 0" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-subtle text-content hover:bg-subtle disabled:opacity-50">↑</button>
                <button type="button" (click)="moveBlock(i, 1)" [disabled]="i === contentBlocks.length - 1" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-subtle text-content hover:bg-subtle disabled:opacity-50">↓</button>
                <button type="button" (click)="removeBlock(i)" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-red-600 text-white hover:bg-red-700">X</button>
              </div>
            </div>

            <div *ngIf="block.get('type')?.value === 'text'">
              <div class="mb-4">
                <label class="block text-sm  text-muted mb-1.5">HTML Content</label>
                <textarea formControlName="content" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none  box-border" rows="4" placeholder="<p>Text goes here</p>"></textarea>
              </div>
            </div>

            <div *ngIf="block.get('type')?.value === 'board'" formGroupName="task">
              <div class="mb-4">
                <label class="block text-sm  text-muted mb-1.5">Lichess URL / Study Link</label>
                <input type="text" formControlName="lichessUrl" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none " placeholder="https://lichess.org/study/..." />
              </div>
              <div class="mb-0">
                <label class="block text-sm  text-muted mb-1.5">Instructions</label>
                <textarea formControlName="instructions" class="w-full px-3 py-2 border border-border-base rounded text-sm bg-white focus:outline-none  box-border" rows="2" placeholder="Move the pawn..."></textarea>
              </div>
            </div>
          </div>
        </ng-container>

        <div *ngIf="contentBlocks.length === 0" class="text-center py-12 px-6 ">
          <p class="text-base">No content blocks. Add a text or board block above.</p>
        </div>
      </div>
    </div>
  </div>
</div>
