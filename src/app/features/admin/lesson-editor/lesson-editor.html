<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <h1 class="admin-page-title">{{ lessonId() ? 'Edit Lesson' : 'New Lesson' }}</h1>
    </div>
    <button [disabled]="saving() || lessonForm.invalid" (click)="saveLesson()" class="admin-btn admin-btn-primary">
      {{ saving() ? 'Saving...' : 'Save Lesson' }}
    </button>
  </div>

  <div *ngIf="loading()" class="admin-card admin-text-center">
    <p>Loading lesson...</p>
  </div>

  <div *ngIf="!loading()">
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Lesson Details</h2>
      </div>
      <form [formGroup]="lessonForm" (ngSubmit)="saveLesson()">
        <div class="admin-form-group">
          <label class="admin-label">Title</label>
          <input type="text" formControlName="title" class="admin-input" placeholder="e.g. The Pawn" />
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Slug (optional)</label>
          <input type="text" formControlName="slug" class="admin-input" placeholder="e.g. the-pawn" />
        </div>

        <div class="admin-form-group admin-mb-0">
          <label class="admin-label">Order</label>
          <input type="number" formControlName="order" class="admin-input" min="1" />
        </div>
      </form>
    </div>

    <div class="admin-card">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Content Blocks</h2>
      </div>
      <div class="admin-flex admin-flex-gap-2 admin-mb-2">
        <button type="button" (click)="addTextBlock()" class="admin-btn admin-btn-secondary">+ Text Block</button>
        <button type="button" (click)="addBoardBlock()" class="admin-btn admin-btn-secondary">+ Board Block</button>
      </div>

      <div formArrayName="content_blocks">
        <ng-container *ngFor="let block of contentBlocks.controls; let i = index">
          <div [formGroupName]="i" class="admin-card" style="background: #fafafa;">
            <div class="admin-flex admin-flex-between admin-flex-center admin-mb-2">
              <span class="admin-badge">{{ block.get('type')?.value }}</span>
              <div>
                <button type="button" (click)="moveBlock(i, -1)" [disabled]="i === 0" class="admin-btn admin-btn-secondary admin-btn-small">↑</button>
                <button type="button" (click)="moveBlock(i, 1)" [disabled]="i === contentBlocks.length - 1" class="admin-btn admin-btn-secondary admin-btn-small">↓</button>
                <button type="button" (click)="removeBlock(i)" class="admin-btn admin-btn-danger admin-btn-small">X</button>
              </div>
            </div>

            <div *ngIf="block.get('type')?.value === 'text'">
              <div class="admin-form-group">
                <label class="admin-label">HTML Content</label>
                <textarea formControlName="content" class="admin-textarea" rows="4" placeholder="<p>Text goes here</p>"></textarea>
              </div>
            </div>

            <div *ngIf="block.get('type')?.value === 'board'" formGroupName="task">
              <div class="admin-form-group">
                <label class="admin-label">Lichess URL / Study Link</label>
                <input type="text" formControlName="lichessUrl" class="admin-input" placeholder="https://lichess.org/study/..." />
              </div>
              <div class="admin-form-group admin-mb-0">
                <label class="admin-label">Instructions</label>
                <textarea formControlName="instructions" class="admin-textarea" rows="2" placeholder="Move the pawn..."></textarea>
              </div>
            </div>
          </div>
        </ng-container>

        <div *ngIf="contentBlocks.length === 0" class="admin-empty">
          <p class="admin-empty-text">No content blocks. Add a text or board block above.</p>
        </div>
      </div>
    </div>
  </div>
</div>
