<div class="max-w-[1200px] space-y-6">
  <div class="flex flex-wrap items-center justify-end gap-4 mb-6">
    <div class="relative min-w-[240px]">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="loadEnrollments()"
        placeholder="Search name, email..."
        class="w-full px-4 py-2 bg-white border border-slate-200 rounded focus:border-blue-500 outline-none"
      />
    </div>

    <select
      [(ngModel)]="statusFilter"
      (ngModelChange)="loadEnrollments()"
      class="px-4 py-2 bg-white border border-slate-200 rounded focus:border-blue-500 outline-none text-sm"
    >
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="contacted">Contacted</option>
      <option value="confirmed">Confirmed</option>
      <option value="paid">Paid</option>
      <option value="cancelled">Cancelled</option>
    </select>
  </div>

  <!-- Table Core -->
  <div
    class="bg-white border border-slate-200 rounded overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-100">
            <th class="px-6 py-4 text-xs  uppercase  text-slate-400">
              Student Info
            </th>
            <th class="px-6 py-4 text-xs  uppercase  text-slate-400">
              Chess Level
            </th>
            <th class="px-6 py-4 text-xs  uppercase  text-slate-400">
              Experience
            </th>
            <th class="px-6 py-4 text-xs  uppercase  text-slate-400">
              Status
            </th>
            <th
              class="px-6 py-4 text-xs  uppercase  text-slate-400 text-right"
            >
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr
            *ngFor="let item of enrollments()"
            class="hover:bg-slate-50"
          >
            <td class="px-6 py-6">
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 rounded bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xl"
                >
                  {{ item.full_name[0] }}
                </div>
                <div>
                  <div class="font-bold text-slate-900">{{ item.full_name }}</div>
                  <div class="text-xs text-slate-500">{{ item.email }}</div>
                  <div class="text-xs text-slate-500">{{ item.contact_number }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-6">
              <span class="px-3 py-1 rounded bg-slate-100 text-xs font-bold">
                {{ item.chess_level }}
              </span>
            </td>
            <td class="px-6 py-6 max-w-xs">
              <p class="text-sm text-slate-500 line-clamp-2" [title]="item.experience">
                {{ item.experience || 'No experience provided' }}
              </p>
            </td>
            <td class="px-6 py-6">
              <select
                [ngModel]="item.status"
                (ngModelChange)="updateStatus(item.id, $event)"
                class="px-3 py-1.5 rounded text-xs font-bold border-none outline-none cursor-pointer"
                [ngClass]="getStatusClass(item.status)"
              >
                <option value="pending">Pending</option>
                <option value="contacted">Contacted</option>
                <option value="confirmed">Confirmed</option>
                <option value="paid">Paid</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </td>
            <td class="px-6 py-6 text-right">
              <button (click)="deleteEnrollment(item.id)" class="px-2 py-1 text-xs font-bold text-rose-500 hover:underline">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="enrollments().length === 0 && !isLoading()">
            <td colspan="5" class="px-6 py-20 text-center text-slate-500">
              No enrollments found matching your criteria.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Loading State -->
    @if (isLoading()) {
      <app-loading></app-loading>
    }
  </div>
</div>
