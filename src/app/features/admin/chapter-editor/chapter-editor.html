<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <h1 class="admin-page-title">{{ chapterId() ? 'Edit Chapter' : 'New Chapter' }}</h1>
    </div>
    <button [disabled]="saving() || chapterForm.invalid" (click)="saveChapter()" class="admin-btn admin-btn-primary">
      {{ saving() ? 'Saving...' : 'Save Chapter' }}
    </button>
  </div>

  <div *ngIf="loading()" class="admin-card admin-text-center">
    <p>Loading chapter...</p>
  </div>

  <div *ngIf="!loading()">
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Chapter Details</h2>
      </div>
      <form [formGroup]="chapterForm" (ngSubmit)="saveChapter()">
        <div class="admin-form-group">
          <label class="admin-label">Title</label>
          <input type="text" formControlName="title" class="admin-input" placeholder="e.g. The Pieces" />
        </div>

        <div class="admin-form-group">
          <label class="admin-label">Order (Sequence Number)</label>
          <input type="number" formControlName="order" class="admin-input" min="1" />
        </div>
      </form>
    </div>

    <div class="admin-card admin-mt-3" *ngIf="chapterId()">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Lessons</h2>
        <a [routerLink]="['/admin/chapter', chapterId(), 'lesson', 'new']" class="admin-btn admin-btn-primary admin-btn-small">+ Add Lesson</a>
      </div>

      <ul class="admin-list" *ngIf="chapter()?.lessons?.length">
        <li class="admin-list-item" *ngFor="let lesson of chapter()?.lessons">
          <div class="admin-list-item-content">
            <div class="admin-list-item-title">#{{ lesson.order }} {{ lesson.title }}</div>
          </div>
          <div class="admin-list-item-actions">
            <a [routerLink]="['/admin/chapter', chapterId(), 'lesson', lesson.id]" class="admin-btn admin-btn-secondary admin-btn-small">Edit</a>
            <button (click)="requestDeleteLesson(lesson.id)" class="admin-btn admin-btn-danger admin-btn-small">Delete</button>
          </div>
        </li>
      </ul>

      <div *ngIf="!chapter()?.lessons?.length" class="admin-empty">
        <p class="admin-empty-text">No lessons yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
@if (deleteLessonTarget()) {
  <div class="admin-modal-overlay" (click)="cancelDeleteLesson()">
    <div class="admin-modal" (click)="$event.stopPropagation()">
      <div class="admin-modal-header">
        <h2 class="admin-modal-title">Delete Lesson</h2>
        <button class="admin-modal-close" (click)="cancelDeleteLesson()">&times;</button>
      </div>
      <div class="admin-modal-body">
        <p>Are you sure you want to delete this lesson?</p>
      </div>
      <div class="admin-modal-footer">
        <button (click)="cancelDeleteLesson()" class="admin-btn admin-btn-secondary">Cancel</button>
        <button (click)="confirmDeleteLesson()" class="admin-btn admin-btn-danger">Delete</button>
      </div>
    </div>
  </div>
}
