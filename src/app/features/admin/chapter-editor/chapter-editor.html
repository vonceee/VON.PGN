<div class="max-w-[1000px] mx-auto p-8 text-slate-800 dark:text-white">
  <div class="flex justify-between items-center mb-8">
    <div class="flex items-center gap-4">
      <button
        (click)="location.back()"
        class="px-4 py-2 rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-white text-slate-800"
      >
        Back
      </button>
      <h1 class="text-3xl font-bold m-0">{{ chapterId() ? 'Edit Chapter' : 'New Chapter' }}</h1>
    </div>
    <button
      [disabled]="saving() || chapterForm.invalid"
      (click)="saveChapter()"
      class="px-4 py-2 rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed text-sm bg-cyan-400 hover:bg-cyan-500 text-slate-900"
    >
      {{ saving() ? 'Saving...' : 'Save Chapter' }}
    </button>
  </div>

  <div *ngIf="loading()" class="text-center py-8 text-slate-500 dark:text-slate-400">
    Loading chapter...
  </div>

  <div *ngIf="!loading()">
    <div
      class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-6 mb-8"
    >
      <h2
        class="mt-0 mb-6 border-b border-slate-200 dark:border-slate-700 pb-2 text-2xl font-semibold"
      >
        Chapter Details
      </h2>
      <form [formGroup]="chapterForm" (ngSubmit)="saveChapter()">
        <div class="mb-6">
          <label class="block mb-2 font-medium text-slate-500 dark:text-slate-400">Title</label>
          <input
            type="text"
            formControlName="title"
            placeholder="e.g. The Pieces"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded focus:outline-none focus:border-cyan-400"
          />
        </div>

        <div class="mb-6">
          <label class="block mb-2 font-medium text-slate-500 dark:text-slate-400"
            >Order (Sequence Number)</label
          >
          <input
            type="number"
            formControlName="order"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded focus:outline-none focus:border-cyan-400"
            min="1"
          />
        </div>
      </form>
    </div>

    <!-- Lessons Section (Only visible if editing an existing chapter) -->
    <div
      class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-6 mb-8"
      *ngIf="chapterId()"
    >
      <div class="flex justify-between items-center mb-6">
        <h2 class="mt-0 mb-0 text-2xl font-semibold">Lessons</h2>
        <a
          [routerLink]="['/admin/chapter', chapterId(), 'lesson', 'new']"
          class="px-2 py-1 text-xs rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed bg-cyan-400 hover:bg-cyan-500 text-slate-900"
          >+ Add Lesson</a
        >
      </div>

      <div class="flex flex-col gap-4">
        <div
          class="bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-slate-700 p-4 rounded flex justify-between items-center"
          *ngFor="let lesson of chapter()?.lessons"
        >
          <div class="flex items-center gap-4">
            <span class="bg-slate-200 dark:bg-white/10 px-2 py-1 rounded text-xs font-bold"
              >#{{ lesson.order }}</span
            >
            <h3 class="m-0 text-lg font-semibold">{{ lesson.title }}</h3>
          </div>
          <div class="flex gap-2">
            <a
              [routerLink]="['/admin/chapter', chapterId(), 'lesson', lesson.id]"
              class="px-2 py-1 text-xs rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-white text-slate-800"
              >Edit</a
            >
            <button
              (click)="deleteLesson(lesson.id)"
              class="px-2 py-1 text-xs rounded font-medium disabled:opacity-50 disabled:cursor-not-allowed bg-red-500 hover:bg-red-600 text-white"
            >
              Delete
            </button>
          </div>
        </div>

        <div
          *ngIf="!chapter()?.lessons?.length"
          class="text-center p-12 bg-slate-50 dark:bg-white/5 rounded-lg text-slate-500 dark:text-slate-400 border border-dashed border-slate-300 dark:border-slate-700"
        >
          <p>No lessons yet.</p>
        </div>
      </div>
    </div>
  </div>
</div>
