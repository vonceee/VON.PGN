<div class="max-w-[1200px]">
  <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">{{ chapterId() ? 'Edit Chapter' : 'New Chapter' }}</h1>
    </div>
    <button [disabled]="saving() || chapterForm.invalid" (click)="saveChapter()" class="inline-block px-4 py-2 rounded-md text-sm   bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50">
      {{ saving() ? 'Saving...' : 'Save Chapter' }}
    </button>
  </div>

  <div *ngIf="loading()" class="bg-white border border-slate-200 rounded-lg p-12 text-center">
    <p>Loading chapter...</p>
  </div>

  <div *ngIf="!loading()">
    <div class="bg-white border border-slate-200 rounded-lg p-5 mb-4">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
        <h2 class="text-base font-semibold text-slate-900 m-0">Chapter Details</h2>
      </div>
      <form [formGroup]="chapterForm" (ngSubmit)="saveChapter()">
        <div class="mb-4">
          <label class="block text-sm  text-slate-700 mb-1.5">Title</label>
          <input type="text" formControlName="title" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white focus:outline-none focus:border-blue-500" placeholder="e.g. The Pieces" />
        </div>

        <div class="mb-4">
          <label class="block text-sm  text-slate-700 mb-1.5">Order (Sequence Number)</label>
          <input type="number" formControlName="order" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white focus:outline-none focus:border-blue-500" min="1" />
        </div>
      </form>
    </div>

    <div class="bg-white border border-slate-200 rounded-lg p-5 mb-4 mt-6" *ngIf="chapterId()">
      <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
        <h2 class="text-base font-semibold text-slate-900 m-0">Lessons</h2>
        <a [routerLink]="['/admin/chapter', chapterId(), 'lesson', 'new']" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-blue-600 text-white hover:bg-blue-700">+ Add Lesson</a>
      </div>

      <ul class="list-none p-0 m-0" *ngIf="chapter()?.lessons?.length">
        <li class="flex justify-between items-center p-4 border border-slate-200 bg-white mb-2 hover:bg-slate-50/50" *ngFor="let lesson of chapter()?.lessons">
          <div class="flex-1">
            <div class="font-semibold mb-1">#{{ lesson.order }} {{ lesson.title }}</div>
          </div>
          <div class="flex gap-2">
            <a [routerLink]="['/admin/chapter', chapterId(), 'lesson', lesson.id]" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-slate-100 text-slate-800 hover:bg-slate-200">Edit</a>
            <button (click)="requestDeleteLesson(lesson.id)" class="inline-block px-3 py-1.5 rounded-md text-xs   bg-red-600 text-white hover:bg-red-700">Delete</button>
          </div>
        </li>
      </ul>

      <div *ngIf="!chapter()?.lessons?.length" class="text-center py-12 px-6 text-slate-500">
        <p class="text-base">No lessons yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
@if (deleteLessonTarget()) {
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000]" (click)="cancelDeleteLesson()">
    <div class="bg-white rounded-lg max-w-[500px] w-[90%] max-h-[80vh] overflow-y-auto" (click)="$event.stopPropagation()">
      <div class="flex justify-between items-center p-4 px-5 border-b border-slate-200">
        <h2 class="text-lg font-semibold m-0">Delete Lesson</h2>
        <button class="bg-none border-none text-xl cursor-pointer text-slate-500 hover:text-slate-800" (click)="cancelDeleteLesson()">&times;</button>
      </div>
      <div class="p-5">
        <p>Are you sure you want to delete this lesson?</p>
      </div>
      <div class="flex gap-3 p-4 px-5 border-t border-slate-200">
        <button (click)="cancelDeleteLesson()" class="inline-block px-4 py-2 rounded text-sm   bg-slate-100 text-slate-800 hover:bg-slate-200">Cancel</button>
        <button (click)="confirmDeleteLesson()" class="inline-block px-4 py-2 rounded text-sm   bg-red-600 text-white hover:bg-red-700">Delete</button>
      </div>
    </div>
  </div>
}
