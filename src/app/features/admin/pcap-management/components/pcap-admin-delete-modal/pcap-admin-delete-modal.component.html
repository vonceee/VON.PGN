@if (item(); as target) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
  <div
    class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4 animate-in fade-in zoom-in-95 duration-150">
    <h3 class="text-base font-bold text-slate-900">
      Delete {{ target.type === 'team' ? 'Team' : 'Match' }}?
    </h3>
    <p class="text-xs text-slate-600 leading-relaxed">
      Are you sure you want to permanently delete <strong>{{ target.name }}</strong>? This action cannot be undone.
    </p>

    <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
      <button type="button" (click)="cancel.emit()"
        class="px-4 py-2 rounded-full text-xs font-semibold border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer">
        Cancel
      </button>
      <button type="button" (click)="confirm.emit()"
        class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white shadow-xs cursor-pointer">
        Delete Permanently
      </button>
    </div>
  </div>
</div>
}
