@if (isOpen() && standing(); as s) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
  <div
    class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4 animate-in fade-in zoom-in-95 duration-150">
    <h3 class="text-base font-bold text-slate-900">
      Edit Standing: {{ s.teamName }}
    </h3>
    <p class="text-xs text-slate-500">Manually adjust match and board point totals for this franchise.</p>

    <div class="grid grid-cols-3 gap-3">
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Wins (W)</label>
        <input type="number" [(ngModel)]="s.won"
          class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Draws (D)</label>
        <input type="number" [(ngModel)]="s.drawn"
          class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Losses (L)</label>
        <input type="number" [(ngModel)]="s.lost"
          class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Board Pts For</label>
        <input type="number" step="0.5" [(ngModel)]="s.boardPointsFor"
          class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Board Pts Against</label>
        <input type="number" step="0.5" [(ngModel)]="s.boardPointsAgainst"
          class="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200" />
      </div>
      <div class="space-y-1">
        <label class="text-[11px] font-semibold text-slate-700">Division</label>
        <select [(ngModel)]="s.conference"
          class="w-full px-2 py-1.5 text-xs rounded-xl border border-slate-200 bg-white">
          <option value="alpha">Division Alpha</option>
          <option value="omega">Division Omega</option>
        </select>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
      <button type="button" (click)="close.emit()"
        class="px-4 py-2 rounded-full text-xs font-semibold border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer">
        Cancel
      </button>
      <button type="button" (click)="save.emit()"
        class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white shadow-xs cursor-pointer">
        Save Standings
      </button>
    </div>
  </div>
</div>
}
