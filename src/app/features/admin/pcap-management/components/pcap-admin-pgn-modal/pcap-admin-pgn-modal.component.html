@if (isOpen() && boardData(); as item) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
  <div
    class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 my-8 space-y-5 animate-in fade-in zoom-in-95 duration-150">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div>
        <h3 class="text-base font-bold text-slate-900">
          Board {{ item.boardNumber }} PGN Storage
        </h3>
        <p class="text-xs text-slate-500">
          <span class="font-semibold text-slate-700">{{ item.playerA }}</span> vs <span
            class="font-semibold text-slate-700">{{ item.playerB }}</span>
        </p>
      </div>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Blitz PGN Section -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-mono">1 POINT</span>
          <span>Blitz Game PGN</span>
        </label>
        <label
          class="cursor-pointer inline-flex items-center gap-1 text-[11px] font-semibold text-blue-600 hover:text-blue-700">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span>Upload .pgn</span>
          <input type="file" accept=".pgn,.txt" (change)="fileSelected.emit({ event: $event, type: 'blitz' })" class="hidden" />
        </label>
      </div>
      <textarea [(ngModel)]="item.blitzPgn" rows="5"
        placeholder="Paste Blitz PGN here... e.g. [Event ...]\n1. e4 c5 2. Nf3..."
        class="w-full px-3 py-2 text-xs font-mono rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50/50"></textarea>
    </div>

    <!-- Rapid PGN Section -->
    <div class="space-y-2 border-t border-slate-100 pt-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-[10px] font-mono">2 POINTS</span>
          <span>Rapid Game PGN</span>
        </label>
        <label
          class="cursor-pointer inline-flex items-center gap-1 text-[11px] font-semibold text-blue-600 hover:text-blue-700">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span>Upload .pgn</span>
          <input type="file" accept=".pgn,.txt" (change)="fileSelected.emit({ event: $event, type: 'rapid' })" class="hidden" />
        </label>
      </div>
      <textarea [(ngModel)]="item.rapidPgn" rows="5"
        placeholder="Paste Rapid PGN here... e.g. [Event ...]\n1. d4 Nf6 2. c4..."
        class="w-full px-3 py-2 text-xs font-mono rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50/50"></textarea>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-3">
      <button type="button" (click)="close.emit()"
        class="px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 hover:bg-slate-50 text-slate-700 cursor-pointer">
        Cancel
      </button>
      <button type="button" (click)="save.emit()"
        class="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white shadow-xs cursor-pointer">
        Save Board PGNs
      </button>
    </div>
  </div>
</div>
}
