<div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse text-xs">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 uppercase font-semibold tracking-wider text-[11px]">
          <th class="px-5 py-3.5">Team</th>
          <th class="px-4 py-3.5">Conference</th>
          <th class="px-4 py-3.5">Roster #</th>
          <th class="px-5 py-3.5 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (team of teams(); track team.id) {
        <tr class="hover:bg-slate-50/80 transition-colors group">
          <td class="px-5 py-3.5 font-bold">
            {{ team.name }}
          </td>
          <td class="px-4 py-3.5 capitalize">
            Division {{ team.conference }}
          </td>
          <td class="px-4 py-3.5">
            <div class="flex items-center gap-1.5">
              @if (team.roster.length > 0) {
              <span class="inline-flex items-center justify-center px-2 py-0.5">
                {{ team.roster.length }}
              </span>
              } @else {
              <span
                class="inline-flex items-center justify-center px-2 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200/60 font-semibold font-mono text-[10px]">
                To Be Announced
              </span>
              }
            </div>
          </td>
          <td class="px-5 py-3.5 text-right">
            <div class="flex items-center justify-end gap-2">
              <button type="button" (click)="editTeam.emit(team)"
                class="px-2.5 py-1 text-blue-600 underline cursor-pointer">
                Edit Roster
              </button>
              <button type="button" (click)="deleteTeam.emit(team)"
                class="px-2.5 py-1 text-red-600 underline cursor-pointer">
                Delete
              </button>
            </div>
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="4" class="px-6 py-12 text-center text-slate-400">
            <div class="flex flex-col items-center justify-center gap-1">
              <span class="font-bold text-slate-700 text-sm">No teams found</span>
              <span class="text-xs text-slate-400">Try adjusting your search query or division filter.</span>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
