<div class="w-full h-full flex flex-col py-8 px-4 md:px-16 overflow-y-auto">
  <header class="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-6">
    <div class="flex-1">
      <h1 class="text-4xl md:text-5xl mb-2">Roadmap</h1>
      <p class="text-muted text-lg">A structured curriculum to take you from beginner to master.</p>
    </div>
  </header>
  <div class="flex-1 flex flex-col mt-8 pb-24 px-0">
    <!-- Error State -->
    @if (hasError()) {
    <div class="flex-1 flex items-center justify-center">
      <app-server-maintenance></app-server-maintenance>
    </div>
    }
    <!-- Skeleton Loading -->
    @else if (isLoading()) {
    <div class="flex-1 flex items-center justify-center">
      <app-loading></app-loading>
    </div>
    } @else if (allCourses().length === 0) {
    <div class="flex-1 flex items-center justify-center">
      <app-server-maintenance></app-server-maintenance>
    </div>
    } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-16 gap-y-12">
      <div>
        <div class="flex flex-col space-y-4">
          @for (course of allCourses(); track course.id) {
          <button type="button" (click)="selectCourse(course.id)"
            class="flex items-center gap-3 w-full text-left rounded-lg px-3 py-2    ">
            <div class="flex-1 min-w-0">
              <span class=" font-normal mr-1.5">Learn</span>
              <span class="font-semibold text-md truncate">{{ course.title }}</span>
            </div>
          </button>
          }
        </div>
      </div>
    </div>
    }
  </div>
</div>
