<div class="w-full h-full flex flex-col py-8 px-4 md:px-16 overflow-y-auto custom-scrollbar">
  <h2 class="text-3xl md:text-5xl leading-tight">
    Roadmap
  </h2>
  <div class="flex-1 flex flex-col items-start mt-8 pb-24 px-0">
    <!-- Error State -->
    @if (hasError()) {
    <app-server-maintenance></app-server-maintenance>
    }
    <!-- Skeleton Loading -->
    @else if (isLoading()) {
    <div class="w-full max-w-3xl space-y-6 animate-pulse">
      <div class="h-8 bg-slate-200 dark:bg-slate-800/80 rounded w-1/4"></div>
      <div class="space-y-4">
        <div class="h-6 bg-slate-200 dark:bg-slate-800/80 rounded w-3/4"></div>
        <div class="h-6 bg-slate-200 dark:bg-slate-800/80 rounded w-2/3"></div>
        <div class="h-6 bg-slate-200 dark:bg-slate-800/80 rounded w-4/5"></div>
        <div class="h-6 bg-slate-200 dark:bg-slate-800/80 rounded w-2/3"></div>
        <div class="h-6 bg-slate-200 dark:bg-slate-800/80 rounded w-3/4"></div>
      </div>
    </div>
    } @else if (allCourses().length === 0) {
    <app-server-maintenance></app-server-maintenance>
    } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-16 gap-y-12">
      <div>
        <h2 class="text-2xl font-semibold mb-6">Fundamentals</h2>
        <div class="flex flex-col space-y-4">
          @for (course of allCourses(); track course.id) {
          <button
            type="button"
            (click)="selectCourse(course.id)"
            class="flex items-center gap-3 w-full text-left rounded-lg px-3 py-2 transition-colors duration-150 hover:bg-slate-50 dark:hover:bg-white/5"
          >
            <div class="flex-1 min-w-0">
              <span class="text-slate-400 font-normal mr-1.5">Learn</span>
              <span class="font-bold text-[17px] truncate">{{ course.title }}</span>
            </div>
            <span
              class="inline-flex items-center rounded-full bg-slate-100 dark:bg-slate-800/70 px-3 py-1.5 text-[10px] font-bold uppercase text-slate-700 dark:text-slate-200"
            >
              Tutorial
            </span>
            <span
              class="inline-flex items-center rounded-full border border-cyan-400 bg-cyan-50 dark:bg-cyan-500/10 px-3 py-1.5 text-[10px] font-bold uppercase text-cyan-700 dark:text-cyan-200"
            >
              Beginner
            </span>
          </button>
          }
        </div>
      </div>
    </div>
    }
  </div>
</div>
