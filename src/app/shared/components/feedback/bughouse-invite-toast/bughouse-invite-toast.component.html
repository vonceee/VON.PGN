<div class="fixed top-16 sm:top-20 right-4 sm:right-6 z-[9999] pointer-events-none flex flex-col gap-3 max-w-[360px] w-full items-end">
  @for (invite of inviteService.incomingInvites(); track invite.id) {
    <div class="pointer-events-auto w-full bg-white border border-slate-200/90 rounded-2xl p-5 shadow-2xl shadow-slate-900/10 transition-all duration-300 transform animate-in fade-in slide-in-from-top-3">
      <!-- Header: Sender Name & Close Button -->
      <div class="flex items-start justify-between gap-3">
        <h3 class="text-base sm:text-lg font-semibold text-slate-900 truncate leading-snug">
          {{ invite.sender }}
        </h3>
        <button
          type="button"
          (click)="onDismiss(invite.id)"
          class="text-slate-400 hover:text-slate-600 p-1 -mr-1 -mt-1 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer"
          title="Dismiss"
          aria-label="Dismiss"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-4.5 sm:h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Subtitle Description -->
      <p class="text-sm sm:text-[15px] text-slate-500 font-normal mt-1 leading-normal">
        Sent you an invite to play Bughouse.
      </p>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2.5 mt-4">
        <button
          type="button"
          (click)="onAccept(invite.id)"
          class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium text-sm transition-all shadow-sm cursor-pointer"
        >
          Accept
        </button>
        <button
          type="button"
          (click)="onDecline(invite.id)"
          class="px-4 py-2 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-medium text-sm transition-all cursor-pointer"
        >
          Decline
        </button>
      </div>
    </div>
  }
</div>
